## Cloudflare Tunnel configuration (example)
# Copy this to your cloudflared config location on the server (often /etc/cloudflared/config.yml)
# and adjust the 'tunnel' and 'credentials-file' values to match your environment.
# This maps api.everydayadvertise.com, everydayadvertise.com, and www.everydayadvertise.com
# to the local Flask app listening on 127.0.0.1:5002 behind NGINX.

# Either the tunnel NAME or UUID (prefer UUID in production)
tunnel: phtv-tunnel

# Path to the tunnel credentials JSON generated by 'cloudflared tunnel create'
credentials-file: /etc/cloudflared/phtv-tunnel.json

ingress:
	- hostname: api.everydayadvertise.com
		service: http://127.0.0.1:5002
	- hostname: everydayadvertise.com
		service: http://127.0.0.1:5002
	- hostname: www.everydayadvertise.com
		service: http://127.0.0.1:5002
	# Fallback for unmatched hosts/paths
	- service: http_status:404

# Optional: tweak origin timeouts and retries
originRequest:
	connectTimeout: 10s
	noHappyEyeballs: true
	http2Origin: true
