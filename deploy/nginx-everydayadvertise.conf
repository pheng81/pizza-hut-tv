# NGINX reverse proxy for EverydayAdvertise (Flask/Gunicorn on 127.0.0.1:5002)
# Uses Cloudflare Origin Certificate for Full (strict) SSL mode

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.everydayadvertise.com;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.everydayadvertise.com;

    # Cloudflare Origin cert and key (place these paths on the server)
    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Reasonable TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Optional HSTS (uncomment after verifying HTTPS works end-to-end)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Accept larger uploads (adjust if needed)
    client_max_body_size 512m;

    # Basic security headers (adjust as needed)
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Health check shortcut
    location = /healthz {
        proxy_pass http://127.0.0.1:5002/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

    # Stream large request bodies directly to upstream without buffering fully on disk
    proxy_request_buffering off;

        proxy_buffering on;
        proxy_buffers 64 16k;
        proxy_busy_buffers_size 64k;

        proxy_pass http://127.0.0.1:5002;
    }
}
