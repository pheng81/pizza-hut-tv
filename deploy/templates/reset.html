<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password</title>
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff;color:#111}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;width:420px;box-shadow:0 10px 30px rgba(0,0,0,.06);position:relative}
    .nav{display:flex;align-items:center;margin:-6px 0 6px}
    .back{display:inline-flex;align-items:center;gap:6px;color:#1f2937;text-decoration:none;font-size:12px}
    .back:hover{text-decoration:underline}
    .back svg{width:16px;height:16px}
    h1{margin:6px 0 14px;font-size:22px;text-align:center}
    label{display:block;font-size:12px;color:#6b7280;margin-bottom:6px}
    input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #d1d5db}
    .btn{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #d1d5db;background:#1e293b;color:#e6edf3;cursor:pointer}
    .flash{color:#b91c1c;font-size:12px;margin-bottom:8px;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <div class="nav">
      <a class="back" href="{{ url_for('login') }}" onclick="if(history.length>1){history.back();return false;}">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.707 3.293a1 1 0 010 1.414L8.414 9H17a1 1 0 110 2H8.414l4.293 4.293a1 1 0 11-1.414 1.414l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        <span>Back</span>
      </a>
    </div>
    <h1>Set a new password</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <label>New password</label>
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
      <div style="margin-top:12px"><button class="btn" type="submit">Update password</button></div>
    </form>
  </div>
</body>
{% include '_cookie_consent.html' %}
</html>
