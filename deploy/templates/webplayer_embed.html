<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Embedded WebView Player</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin:0; padding:0; background:#000; color:#ccc; width:100%; height:100%; overflow:hidden; font-family:system-ui, sans-serif; }
  #videoWrapper { position:relative; width:100vw; height:100vh; background:#000; overflow:hidden; }
  video { position:absolute; top:0; left:0; transform-origin: top left; background:#000; }
  #status { position:fixed; left:6px; bottom:4px; font-size:11px; line-height:1.2; background:rgba(0,0,0,0.4); padding:4px 6px; border-radius:4px; pointer-events:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="videoWrapper">
  <video id="player" playsinline webkit-playsinline muted></video>
</div>
<div id="status"></div>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const store = qs.get('store');
  const screen = qs.get('screen');
  const debug = qs.get('debug') === '1' || qs.get('debug') === 'true';
  if(!store || !screen){
    document.getElementById('status').textContent = 'Missing store or screen param';
    return;
  }

  const player = document.getElementById('player');
  const statusEl = document.getElementById('status');

  let playlist = [];
  let currentIndex = -1;
  let currentSyncRef = null;

  async function fetchPlaylist(){
    try {
      const resp = await fetch(`/playlist/${store}/${screen}?_ts=`+Date.now(), {cache:'no-store'});
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      playlist = (data.playlist || data.items || []);
      if(!Array.isArray(playlist)) playlist = [];
      log('Playlist size='+playlist.length);
      if(currentIndex === -1) {
        nextItem();
      }
    } catch(e){
      log('Playlist fetch failed: '+e.message);
      setTimeout(fetchPlaylist, 5000);
    }
  }

  function log(msg){
    statusEl.textContent = msg;
    console.log('[WEBPLAYER]', msg);
  }

  function nextItem(){
    if(!playlist.length){
      log('No playlist items; retrying...');
      setTimeout(fetchPlaylist, 4000);
      return;
    }
    currentIndex = (currentIndex + 1) % playlist.length;
    const item = playlist[currentIndex];
    currentSyncRef = item && item.sync_ref ? item.sync_ref : null;
    const url = item.slice_url || item.url || item.video_url || item.src;
    if(!url){
      log('Item missing url, skipping');
      return nextItem();
    }
    log('Playing '+(currentIndex+1)+'/'+playlist.length+(currentSyncRef ? ' sync_ref mode='+currentSyncRef.mode : ''));
    applyDefaultVideoConfig();
    player.src = url + (url.includes('?') ? '&' : '?') + '_pvt=' + Date.now();
    player.load();
    player.play().catch(err=>{ log('Autoplay blocked? '+err.message); });
  }

  function applyDefaultVideoConfig(){
    player.style.width = '100%';
    player.style.height = '100%';
    player.style.transform = 'translate(0,0) scale(1)';
  }

  function applyCropping(){
    if(!currentSyncRef) return;
    const mode = currentSyncRef.mode;
    let order = Number(currentSyncRef.order || 0);
    let count = Number(currentSyncRef.count || 1);
    if(count < 1) count = 1;
    if(order < 0) order = 0;
    if(order >= count) order = count - 1;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const videoWidth = player.videoWidth;
    const videoHeight = player.videoHeight;
    if(!videoWidth || !videoHeight){
      log('Video metadata not ready for cropping');
      return;
    }

    if(mode === 'split-h' && count > 1){
      // Scale video to fill viewport height; determine slice width as fraction of total intrinsic width
      const scale = vh / videoHeight;
      const displayedFullWidth = videoWidth * scale;
      const perSliceDisplayedWidth = displayedFullWidth / count;
      player.style.width = (videoWidth * scale) + 'px';
      player.style.height = (videoHeight * scale) + 'px';
      const xOffset = -order * perSliceDisplayedWidth;
      player.style.transform = `translate(${xOffset}px, 0px) scale(1)`;
    } else if(mode === 'split-v' && count > 1){
      // Scale video to fill viewport width; determine slice height as fraction of total intrinsic height
      const scale = vw / videoWidth;
      const displayedFullHeight = videoHeight * scale;
      const perSliceDisplayedHeight = displayedFullHeight / count;
      player.style.width = (videoWidth * scale) + 'px';
      player.style.height = (videoHeight * scale) + 'px';
      const yOffset = -order * perSliceDisplayedHeight;
      player.style.transform = `translate(0px, ${yOffset}px) scale(1)`;
    } else {
      applyDefaultVideoConfig();
    }
    if(!debug){
      // Hide status after successful crop if not debugging
      try { statusEl.style.opacity = '0'; } catch(_){ }
    }
  }

  player.addEventListener('loadedmetadata', applyCropping);
  player.addEventListener('ended', nextItem);

  setInterval(fetchPlaylist, 60000);
  fetchPlaylist();
  window.addEventListener('resize', applyCropping);
})();
</script>
</body>
</html>
