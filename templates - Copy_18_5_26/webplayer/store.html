<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Player — Store Code</title>
  <!-- Socket.IO for real-time communication -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{
      --bg:#0b0f14;          /* deep slate */
      --panel:#0f141a;       /* elevated surface */
      --border:#18202a;      /* soft outline */
      --text:#e6eef7;        /* near-white with blue tint */
      --muted:#95a3b5;       /* cool-muted */
      --accent:#3b82f6;      /* blue accent */
      --accent-hover:#2563eb;/* darker hover */
      --radius:12px;
      --safe-margin:var(--tv-safe-margin, 0);
    }
    html,body{height:100%;margin:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:var(--bg);color:var(--text);
      padding:calc(env(safe-area-inset-top,0px) + 0px) calc(env(safe-area-inset-right,0px) + 0px) calc(env(safe-area-inset-bottom,0px) + 0px) calc(env(safe-area-inset-left,0px) + 0px);
    }
    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:clamp(18px, 3vw, 24px);
      max-width:min(520px, 88vw);
      width:min(88vw, 520px);
      box-shadow:none; /* flat */
    }
    h1{margin:0 0 10px;font-size:clamp(20px, 2.6vw, 24px);text-align:center;font-weight:800}
    p{margin:0 0 14px;color:var(--muted);font-size:clamp(13px, 1.8vw, 14px);text-align:center}
    label{display:block;font-size:clamp(12px, 1.6vw, 13px);color:#cfd8e3;margin:10px 0 8px}
    input{
      width:100%;padding:clamp(12px, 2.2vw, 14px) clamp(14px, 2.4vw, 16px);
      background:#0a0f14;border:1px solid #223042;border-radius:10px;color:#e6eef7;outline:none;text-align:center;letter-spacing:1px;font-weight:700;font-size:clamp(16px, 2.4vw, 18px);box-sizing:border-box
    }
    input::placeholder{color:#7f90a6}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.18)}
    .btn{
      margin-top:14px;width:100%;
      padding:clamp(12px, 2.4vw, 14px) clamp(16px, 2.8vw, 18px);
      border:none;border-radius:10px;background:var(--accent);color:#0a0f14;font-weight:800;cursor:pointer;font-size:clamp(14px, 2.2vw, 16px);box-sizing:border-box;letter-spacing:.3px
    }
    .btn:hover{background:var(--accent-hover)}
    .note{margin-top:12px;font-size:clamp(11px, 1.6vw, 12px);color:#95a3b5;text-align:center}
    /* QR container */
    #qr-section{ text-align:center; margin:16px 0; padding:16px; background:#11161d; border:1px solid var(--border); border-radius:10px; }
    #qrcode{ display:inline-block; padding:10px; background:#fff; border-radius:8px }
    #qrcode canvas, #qrcode img{ width:clamp(120px, 20vw, 150px); height:auto; image-rendering:crisp-edges }
    .card :focus-visible{ outline:2px solid rgba(59,130,246,.35); outline-offset:2px; border-radius:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter store code</h1>
    <p>TV code: <strong id="tvcode"></strong></p>
    
    <!-- Mobile QR Code Section -->
    <div id="qr-section">
      <div style="font-size:14px;color:#bbb;margin-bottom:12px;">📱 Continue on your phone</div>
      <div id="qrcode" style="display:inline-block;padding:12px;background:#fff;border-radius:8px;"></div>
      <div style="font-size:12px;color:#999;margin-top:12px;">Store code entered on phone will appear here</div>
    </div>
    
  <label for="store">Store code</label>
  <input id="store" maxlength="8" inputmode="numeric" placeholder="Store code (e.g. 1000)" />
  <button class="btn" id="go">Continue</button>
    <div class="note">You'll choose a screen next.</div>
  </div>
  <script>
    function getQuery(){
      var q = {};
      try{
        var s = window.location.search || '';
        if(s && s.charAt(0)==='?') s = s.slice(1);
        var parts = s.split('&');
        for(var i=0;i<parts.length;i++){
          var kv = parts[i].split('=');
          var k = decodeURIComponent(kv[0]||'');
          var v = decodeURIComponent((kv[1]||'').replace(/\+/g,' '));
          if(k) q[k]=v;
        }
      }catch(e){}
      return q;
    }
    var params = getQuery();
    var code = (params.code||'').replace(/\s+/g,'');
    if(!(code.length===4 && /^[0-9]{4}$/.test(code))){ window.location.href = '/webplayer'; }
    document.getElementById('tvcode').textContent = code;
    var storeEl = document.getElementById('store');
    try{ storeEl.addEventListener('input', function(){ storeEl.value = storeEl.value.replace(/[^0-9]/g,'').slice(0,8); }); }catch(e){}
    function go(){
      var s = (storeEl.value||'').replace(/\s+/g,'');
      if(!s){ alert('Please enter your store code.'); return; }
      
      // Preserve session ID when navigating to next page
      var sessionParam = params.session;
      var url = '/webplayer/browse?code=' + encodeURIComponent(code) + '&store_id=' + encodeURIComponent(s);
      if (sessionParam) {
        url += '&session=' + encodeURIComponent(sessionParam);
      }
      
      window.location.href = url;
    }
    try{ document.getElementById('go').addEventListener('click', go); }catch(e){}
    try{ document.addEventListener('keydown', function(e){ e=e||window.event; if((e.key||e.keyCode)==='Enter' || e.keyCode===13){ go(); } }); }catch(e){}
    setTimeout(function(){ try{ storeEl.focus(); }catch(e){} }, 50);
    
    // Mobile-to-TV store code sharing - REUSE existing session, don't create new one
    var sessionId = params.session; // Use existing session from URL
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var targetSessionId = params.session;
    
    try{
      if (sessionId && !isMobile) {
        // TV/Desktop mode with existing session - reconnect with SAME session ID
        // Only show QR if no session (shouldn't happen in normal flow)
        document.getElementById('qr-section').style.display = 'none';
        
        console.log('TV mode: Connecting with session:', sessionId);
        
        // Reconnect WebSocket with the SAME session ID
        var socket = io();
        socket.emit('join_session', { session_id: sessionId });
        console.log('TV: Joined session:', sessionId);
        
        socket.on('store_code_entered', function(data) {
          console.log('TV received store_code_entered:', data);
          console.log('Checking:', data.session_id, '===', sessionId, '?', data.session_id === sessionId);
          console.log('Store code:', data.store_code);
          
          if (data.store_code) {
            console.log('Setting store input to:', data.store_code);
            document.getElementById('store').value = data.store_code;
            // Auto-submit after receiving store code
            console.log('Auto-submitting in 500ms...');
            setTimeout(function() { 
              console.log('Calling go() function');
              go(); 
            }, 500);
          }
        });
      } else if (!targetSessionId && !isMobile) {
        // TV/Desktop mode WITHOUT session - show QR code (fallback)
        sessionId = 'store_' + Math.random().toString(36).substring(2, 15);
        var currentUrl = window.location.origin + window.location.pathname + '?code=' + code + '&session=' + sessionId;
        var qr = new QRCode(document.getElementById("qrcode"), {
          text: currentUrl,
          width: 150,
          height: 150,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        
        // Connect WebSocket to receive store code from mobile
        var socket = io();
        socket.emit('join_session', { session_id: sessionId });
        
        socket.on('store_code_entered', function(data) {
          if (data.session_id === sessionId && data.store_code) {
            document.getElementById('store').value = data.store_code;
            // Auto-submit after receiving store code
            setTimeout(function() { go(); }, 500);
          }
        });
      } else {
        // Mobile mode - hide QR, show input prominently
        document.getElementById('qr-section').style.display = 'none';
        
        if (targetSessionId) {
          // This is mobile continuing from QR - connect to send store code to TV
          var socket = io();
          var storeInput = document.getElementById('store');
          var advanceTimer = null;
          var latestCode = '';
          var sendAcked = false;
          var retryTimer = null;

          function pushHttpFallback(sc){
            try{
              fetch('/api/store_session_push',{
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ session_id: targetSessionId, store_code: sc })
              }).catch(function(){});
            }catch(e){}
          }

          function sendLatestOnce(){
            try{
              socket.emit('send_store_code', { session_id: targetSessionId, store_code: latestCode });
            }catch(e){}
            // Also HTTP push for reliability
            if(latestCode && latestCode.length>=4){ pushHttpFallback(latestCode); }
          }

          function ensureDelivery(sc){
            latestCode = sc;
            sendAcked = false;
            // send immediately
            sendLatestOnce();
            // retry a few times for 2s total
            var attempts = 0;
            if(retryTimer) clearInterval(retryTimer);
            retryTimer = setInterval(function(){
              attempts++;
              if(sendAcked || attempts>7){ clearInterval(retryTimer); retryTimer=null; return; }
              sendLatestOnce();
            }, 300);
          }

          socket.on('connect', function(){ if(latestCode){ sendLatestOnce(); } });
          socket.on('store_code_sent_ack', function(msg){ if(msg && msg.status==='success'){ sendAcked = true; } });

          var deb;
          storeInput.addEventListener('input', function(){
            var sc = storeInput.value.replace(/\D+/g,'');
            clearTimeout(deb);
            deb = setTimeout(function(){
              if(sc.length>=3){ ensureDelivery(sc); }
              // Plan navigation only for 4+ digits
              if (sc.length>=4){
                // Give TV ~800ms after a successful send; if no ack, still proceed after 1.2s
                var delay = sendAcked ? 800 : 1200;
                if(advanceTimer) clearTimeout(advanceTimer);
                advanceTimer = setTimeout(function(){
                  var nextUrl = '/webplayer/browse?code=' + encodeURIComponent(code) + '&store_id=' + encodeURIComponent(sc) + '&session=' + encodeURIComponent(targetSessionId);
                  window.location.href = nextUrl;
                }, delay);
              }
            }, 150);
          });
        }
      }
    }catch(e){
      // If QR code fails, hide section
      try{ document.getElementById('qr-section').style.display = 'none'; }catch(e2){}
    }
  </script>
</body>
</html>
