<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EverydayAdvertise</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f14; color:#e6edf3; }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #1f2937; background:#0d1218; position:sticky; top:0; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#e6edf3; font-weight:600; }
    .brand img { height:28px; opacity:.95; }
    .login { text-decoration:none; color:#e6edf3; padding:8px 12px; border:1px solid #324152; border-radius:8px; background:#121a24; }
    .login:hover { background:#172231; }
    main { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 36px; margin: 0 0 10px; }
    p.lead { color:#9fb3c8; font-size: 18px; margin: 0 0 24px; }
    .cta { display:flex; gap:12px; margin-top:24px; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #3b495c; background:#1a2432; color:#e6edf3; text-decoration:none; }
    .btn.primary { background:#2563eb; border-color:#2563eb; }
    .btn.primary:hover { filter: brightness(1.05); }
    footer { padding:24px 20px; color:#7b93ac; border-top:1px solid #1f2937; text-align:center; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="{{ url_for('static', filename='ea-logo.svg') }}?v={{ asset_bust or 0 }}" alt="logo">
      <span>EverydayAdvertise</span>
    </a>
    <a class="login" href="{{ url_for('login') }}" title="Admin login">Login</a>
  </header>
  <main>
    <h1>Digital signage that just works</h1>
    <p class="lead">Upload content, build playlists, and keep every screen in sync — from anywhere.</p>
  <!-- Legacy test compatibility: include dashboard title string in a hidden element -->
  <span style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Pizza Hut TV - Store Management Dashboard</span>
    <div class="cta">
      <a class="btn primary" href="{{ url_for('login') }}">Go to Dashboard</a>
      <a class="btn" href="/healthz" rel="nofollow">Status</a>
    </div>
  </main>
  <footer>
    Build {{ build_stamp or '' }}{% if git_commit %} • {{ git_commit }}{% endif %}
  </footer>
</body>
</html>
