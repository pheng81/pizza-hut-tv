<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Debug Crop Player</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
 body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 0; background:#111; color:#eee; }
 header { padding:10px 16px; background:#222; font-size:14px; }
 #log { font-size:12px; max-height:160px; overflow:auto; background:#000; padding:8px; white-space:pre-wrap; }
 .flex { display:flex; gap:24px; padding:16px; }
 .panel { flex:1; min-width:320px; }
 video { max-width:100%; background:#000; }
 .viewport-wrapper { position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; border:2px solid #333; }
 #masterVideo { position:absolute; top:0; left:0; transform-origin:0 0; }
 .badge { display:inline-block; padding:2px 6px; background:#444; border-radius:4px; margin-right:8px; }
 .warn { color:#ffb347; }
 .error { color:#ff6b6b; }
 button { background:#444; color:#eee; border:1px solid #555; padding:6px 12px; cursor:pointer; border-radius:4px; }
 button:hover { background:#555; }
 table.meta { font-size:13px; border-collapse:collapse; }
 table.meta td { padding:2px 6px; border-bottom:1px solid #333; }
</style>
</head>
<body>
<header>
 <span class="badge">Debug Player</span>
 Store: <strong id="storeId"></strong> | Screen: <strong id="screenId"></strong>
 <button id="reloadBtn">Reload Layout</button>
 <button id="toggleGuideBtn">Toggle Guides</button>
</header>
<div class="flex">
 <div class="panel">
  <h3>Viewport (Cropped)</h3>
  <div class="viewport-wrapper" id="viewport">
    <video id="masterVideo" playsinline muted loop></video>
  </div>
  <div style="margin-top:8px; font-size:12px;" id="dimInfo"></div>
 </div>
 <div class="panel">
  <h3>Layout Meta</h3>
  <table class="meta" id="metaTable"></table>
  <h3>Log</h3>
  <div id="log"></div>
 </div>
</div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const storeId = params.get('store') || '{{ store_id }}';
  const screenId = params.get('screen') || '{{ screen_id }}';
  document.getElementById('storeId').textContent = storeId;
  document.getElementById('screenId').textContent = screenId;
  const logEl = document.getElementById('log');
  function log(msg, cls){
    const div = document.createElement('div');
    if(cls) div.className = cls;
    div.textContent = '['+new Date().toLocaleTimeString()+'] '+msg;
    logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }
  const api = `/api/sync_layout/${storeId}/${screenId}`;
  const video = document.getElementById('masterVideo');
  let guidesOn = false;
  document.getElementById('toggleGuideBtn').onclick = () => {
    guidesOn = !guidesOn;
    document.getElementById('viewport').style.outline = guidesOn ? '2px solid #0af' : '2px solid #333';
    video.style.outline = guidesOn ? '1px dashed #fa0' : 'none';
  };
  document.getElementById('reloadBtn').onclick = loadLayout;

  async function loadLayout(){
    log('Fetching layout '+api);
    try {
      const r = await fetch(api, {cache:'no-store'});
      const j = await r.json();
      if(!r.ok){
        log('Layout error '+JSON.stringify(j), 'error');
        return;
      }
      renderMeta(j);
      if(!j.synced){
        log('Screen not in sync group', 'warn');
      }
      if(j.master_video){
        if(video.getAttribute('data-src') !== j.master_video){
          video.src = j.master_video;
          video.setAttribute('data-src', j.master_video);
          video.addEventListener('loadedmetadata', ()=>{
            video.play().catch(()=>{});
            applyCrop(j);
          }, {once:true});
        } else {
          applyCrop(j);
        }
      }
    } catch(e){
      log('Fetch error '+e.message, 'error');
    }
  }

  function renderMeta(j){
    const tbl = document.getElementById('metaTable');
    tbl.innerHTML = '';
    const add = (k,v)=>{ const tr=document.createElement('tr'); tr.innerHTML = `<td>${k}</td><td>${v}</td>`; tbl.appendChild(tr); };
    Object.entries(j).forEach(([k,v])=>{
      if(typeof v === 'object') v = JSON.stringify(v);
      add(k,v);
    });
  }

  function applyCrop(j){
    const crop = j.crop; if(!crop){ log('No crop data','warn'); return; }
    const iw = j.intrinsic_size?.width || 0;
    const ih = j.intrinsic_size?.height || 0;
    if(!iw||!ih){ log('Missing intrinsic size','warn'); return; }
    // Strategy: scale video so that its natural size maps 1:1 to CSS pixels width; then shift left by crop.x
    const viewport = document.getElementById('viewport');
    const viewW = viewport.clientWidth;
    const scale = viewW / crop.width; // scale so that cropped width fits viewport
    video.style.width = (iw * scale) + 'px';
    video.style.height = (ih * scale) + 'px';
    video.style.transform = `translate(${-crop.x * scale}px, ${-crop.y * scale}px)`;
    document.getElementById('dimInfo').textContent = `Intrinsic ${iw}x${ih} | Crop ${crop.width}x${crop.height} @ (${crop.x},${crop.y}) scale=${scale.toFixed(3)}`;
    log('Applied crop x='+crop.x+' w='+crop.width+' scale='+scale.toFixed(3));
  }

  loadLayout();
})();
</script>
</body>
</html>
