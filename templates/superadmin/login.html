<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Login</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b1020; color:#e6edf3; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#111830; padding:28px; border-radius:12px; width:min(420px, 92vw); box-shadow:0 10px 30px rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.08); }
    h1 { margin:0 0 16px 0; font-size:22px; }
    label { display:block; font-size:14px; margin:10px 0 6px; opacity:.9 }
    input[type=text], input[type=password] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0c1327; color:#e6edf3; outline:none; }
    input[type=text]:focus, input[type=password]:focus { border-color:#7c9cff; box-shadow:0 0 0 3px rgba(124,156,255,0.18) }
    .btn { width:100%; margin-top:14px; background:linear-gradient(135deg,#6f86ff,#9a7bff); color:#0b0f1e; border:none; padding:12px 14px; font-weight:600; border-radius:10px; cursor:pointer }
    .muted { margin-top:12px; font-size:12px; color:#9fb0cc; text-align:center }
    a { color:#9db2ff; text-decoration:none }
  </style>
  </head>
<body>
  <form class="card" method="post" action="">
    <h1>Super Admin Login</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin:8px 0 12px; font-size:13px; color:#ffbfbf">
          {% for category, message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <div class="muted">
      <a href="/">Back to site</a>
    </div>
  </form>
</body>
</html>
