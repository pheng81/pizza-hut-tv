<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Loop</title>
  <style>
    html,body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui, sans-serif; }
    body { display:flex; align-items:center; justify-content:center; }
    #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    img { width:100%; height:100%; object-fit:contain; }
    #meta { position:fixed; top:6px; left:10px; font-size:11px; opacity:.35; }
  </style>
</head>
<body>
  <div id="meta">Loop ({{ images|length }} images) – F11 fullscreen</div>
  <div id="stage"></div>
  <script id="data-images" type="application/json">{{ images|tojson }}</script>
  <script>
    var images = JSON.parse(document.getElementById('data-images').textContent);
    var interval = {{ interval }}; // ms
    const stage = document.getElementById('stage');
    let idx = -1;
    function showNext(){
      if(!images.length){ stage.innerHTML = '<p style="opacity:.4;font:16px system-ui;">No images</p>'; return; }
      idx = (idx + 1) % images.length;
      const name = images[idx];
      const img = new Image();
      img.alt = name;
      img.decoding = 'async';
      img.loading = 'eager';
      img.src = `${window.location.origin}/static/uploads/${name}?t=${Date.now()}`;
      img.onload = ()=> { stage.innerHTML=''; stage.appendChild(img); };
    }
    showNext();
    setInterval(showNext, interval);
    // Keyboard skip
    window.addEventListener('keydown', e => { if(e.key==='ArrowRight'){ showNext(); } });
  </script>
</body>
</html>
