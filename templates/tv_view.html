<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TV View</title>
	<style>
		html, body { height:100%; margin:0; background:#000; color:#fff; }
		#stage { position:relative; width:100vw; height:100vh; overflow:hidden; background:#000; }
		.layer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
		.hidden { display:none; }
		.media { max-width:100%; max-height:100%; object-fit:contain; }
		.fade { opacity:0; transition: opacity .25s ease; }
		.visible { opacity:1; }
	</style>
</head>
<body>
	<div id="stage">
		<div class="layer" id="layerA"></div>
		<div class="layer" id="layerB"></div>
		</div>

		<!-- Provide template vars as JSON so JS linter doesn't choke on Jinja syntax -->
		<script id="tv-data" type="application/json">{"store_id": {{ store_id|tojson }}, "screen_id": {{ screen_id|tojson }}, "initial_file": {{ active_file|tojson }}}</script>
		<script>
			const __tvCfg = JSON.parse(document.getElementById('tv-data')?.textContent || '{}');
			// Ensure we always talk to HTTPS origin. If we don't have one (e.g., file://),
			// fall back to the public domain.
			const DEFAULT_ORIGIN = 'https://api.everydayadvertise.com';
			const ORIGIN = (window.location && window.location.origin)
				? (window.location.origin.startsWith('http:')
					? window.location.origin.replace(/^http:/, 'https:')
					: window.location.origin)
				: DEFAULT_ORIGIN;
			// If we're on our domain but over http, enforce https.
			try {
				if (location.protocol === 'http:' && /(^|\.)everydayadvertise\.com$/i.test(location.hostname)) {
					location.replace('https:' + location.href.slice(5));
				}
			} catch {}
			const storeId = __tvCfg.store_id;
			const screenId = __tvCfg.screen_id;
			const initialFile = __tvCfg.initial_file;

		const videoExt = ['mp4','webm','ogg','mov','avi','mkv','m4v'];
		function isVideoByName(name){ if(!name) return false; const ext=(name.split('.').pop()||'').toLowerCase(); return videoExt.includes(ext); }
		function mediaUrl(item){
			if(!item) return '';
			if(typeof item === 'string') {
				if (/^https?:\/\//i.test(item)) {
					const abs = item.replace(/^http:/, 'https:');
					// If same-origin absolute like https://api.../FILENAME, rewrite to proper path
					try{
						const u = new URL(abs);
						const same = u.host === (new URL(ORIGIN)).host;
						if(same && /^\/[A-Za-z0-9._-]+$/.test(u.pathname)){
							const fname = u.pathname.slice(1);
							const isVid = isVideoByName(fname);
							return `${ORIGIN}${isVid?'/media/':'/static/uploads/'}${fname}`;
						}
					}catch{}
					return abs;
				}
				const rel = item.startsWith('/') ? item : `/static/uploads/${item}`;
				return `${ORIGIN}${rel}`;
			}
			const u = item.url || item.file || '';
			if (/^https?:\/\//i.test(u)) {
				const abs = u.replace(/^http:/, 'https:');
				try{
					const uu = new URL(abs);
					const same = uu.host === (new URL(ORIGIN)).host;
					if(same && /^\/[A-Za-z0-9._-]+$/.test(uu.pathname)){
						const fname = uu.pathname.slice(1);
						const isVid = isVideoByName(fname);
						return `${ORIGIN}${isVid?'/media/':'/static/uploads/'}${fname}`;
					}
				}catch{}
				return abs;
			}
			const rel = u.startsWith('/') ? u : `/static/uploads/${u}`;
			return `${ORIGIN}${rel}`;
		}

		const stage = document.getElementById('stage');
		const layerA = document.getElementById('layerA');
		const layerB = document.getElementById('layerB');
		let front = layerA, back = layerB;

		let playlist = [];
		let idx = 0;
		let timer = null;
		let lastFetchTs = 0;

		async function fetchPlaylist(){
			try{
				const r = await fetch(`${ORIGIN}/playlist/${storeId}/${screenId}`);
				const j = await r.json();
				if(j && j.success && Array.isArray(j.playlist)){
					playlist = j.playlist;
					if(idx >= playlist.length) idx = 0;
				}
			}catch(e){ /* keep current on error */ }
			lastFetchTs = Date.now();
		}

		function preloadImage(url){
			return new Promise((resolve,reject)=>{ const img = new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=url; });
		}
		function preloadVideo(url){
			return new Promise((resolve,reject)=>{
				const v = document.createElement('video');
				v.autoplay = false; v.muted = true; v.playsInline = true; v.preload = 'auto';
				const onReady = ()=>{ cleanup(); resolve(v); };
				const onErr = (e)=>{ cleanup(); reject(e); };
				function cleanup(){ v.removeEventListener('canplay', onReady); v.removeEventListener('error', onErr); }
				v.addEventListener('canplay', onReady);
				v.addEventListener('error', onErr);
				v.src = url; v.load();
			});
		}

		function hostOf(u){ try { return (new URL(u)).host; } catch { return ''; } }
		function fileNameFrom(item){
			if(!item) return '';
			if(typeof item === 'string'){
				try{ const u = new URL(item); return (u.pathname.split('/').pop()||''); }catch{ return (item.split('/').pop()||''); }
			}
			const f = item.file || '';
			if(f) return String(f).split('/').pop()||'';
			const u = item.url || '';
			try{ const p = new URL(u).pathname; return (p.split('/').pop()||''); }catch{ return (String(u).split('/').pop()||''); }
		}

		function clearNode(node){ while(node.firstChild) node.removeChild(node.firstChild); }

		function swapLayers(){ const t = front; front = back; back = t; }

		async function showItem(item){
			const url = mediaUrl(item);
			if(!url){ return; }
			const type = (item.media_type || '').toLowerCase();
			const isVid = type === 'video' || isVideoByName(url);
			const thisHost = hostOf(url);
			const ourHost = hostOf(ORIGIN);
			// Build a local fallback if primary URL is external and fails
			let fallbackUrl = '';
			if(thisHost && ourHost && thisHost !== ourHost){
				const fname = fileNameFrom(item);
				if(fname){
					fallbackUrl = isVid ? `${ORIGIN}/media/${encodeURIComponent(fname)}`
										 : `${ORIGIN}/static/uploads/${encodeURIComponent(fname)}`;
				}
			}
			try{
				const node = isVid ? await preloadVideo(url) : await preloadImage(url);
				node.className = 'media';
				if(isVid){ node.loop = true; node.autoplay = true; node.muted = true; node.playsInline = true; }
				// prepare back layer
				clearNode(back); back.appendChild(node);
				back.classList.add('fade'); back.classList.remove('hidden');
				// start video after in DOM (for some platforms)
				if(isVid){ setTimeout(()=>{ try{ node.play().catch(()=>{});}catch{} }, 0); }
				// crossfade
				requestAnimationFrame(()=>{
					back.classList.add('visible'); back.classList.remove('fade');
					front.classList.add('fade'); front.classList.remove('visible');
					setTimeout(()=>{ front.classList.add('hidden'); front.classList.remove('fade'); swapLayers(); }, 260);
				});
			}catch(e){
				// Try fallback via our origin if available
				if(fallbackUrl){
					try{
						const node = isVid ? await preloadVideo(fallbackUrl) : await preloadImage(fallbackUrl);
						node.className = 'media';
						if(isVid){ node.loop = true; node.autoplay = true; node.muted = true; node.playsInline = true; }
						clearNode(back); back.appendChild(node);
						back.classList.add('fade'); back.classList.remove('hidden');
						if(isVid){ setTimeout(()=>{ try{ node.play().catch(()=>{});}catch{} }, 0); }
						requestAnimationFrame(()=>{
							back.classList.add('visible'); back.classList.remove('fade');
							front.classList.add('fade'); front.classList.remove('visible');
							setTimeout(()=>{ front.classList.add('hidden'); front.classList.remove('fade'); swapLayers(); }, 260);
						});
						return;
					}catch(_f){ /* swallow */ }
				}
				/* skip on error */
			}
		}

		function nextIndex(){ if(!playlist.length) return 0; return (idx + 1) % playlist.length; }

		async function tick(){
			if(!playlist.length){ await fetchPlaylist(); }
			if(!playlist.length){ timer = setTimeout(tick, 1500); return; }
			const item = playlist[idx];
			const dur = Math.max(1, parseInt(item.duration||10));
			// Preload the next item a bit early
			const next = playlist[nextIndex()];
			if(next){ const u = mediaUrl(next); if(u){ const pre = isVideoByName(u) ? preloadVideo(u) : preloadImage(u); pre.catch(()=>{}); } }
			await showItem(item);
			idx = nextIndex();
			// periodic refresh of playlist
			if(Date.now() - lastFetchTs > 20000){ fetchPlaylist(); }
			timer = setTimeout(tick, dur*1000);
		}

		// Initial paint (use initialFile if given)
		(async function init(){
			if(initialFile){ try{ await showItem({file: initialFile}); }catch{} }
			tick();
			document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(timer){ clearTimeout(timer); timer=null; } } else { if(!timer) tick(); } });
		})();
	</script>
</body>
</html>
