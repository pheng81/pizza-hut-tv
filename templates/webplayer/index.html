<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web Player — TV Code</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;display:grid;grid-template-rows:1fr auto;min-height:100vh;background:#000;color:#f4f4f4}
  /* Center intro across a wide range of TV browsers */
  .intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b0b;z-index:10}
  .intro{transition:opacity .25s ease}
  @supports (place-items: center){
    .intro{display:grid;place-items:center}
    .intro > *{grid-area:1/1}
  }
  /* Make the intro about 50% smaller than before */
  .intro .logo{width:min(36vw,440px);height:auto;opacity:.96;max-height:48vh}
  /* Simple, safe intro animation for older TV browsers (Tizen): scale+fade in */
  @keyframes tizenIntro { from { opacity:0; transform: scale(0.97); } to { opacity:1; transform: scale(1); } }
  .anim-simple { animation: tizenIntro 650ms ease-out 1; }
  .panel{background:#0d0d0d;border:none;border-radius:12px;padding:28px;max-width:560px;width:min(92vw,560px);box-shadow:0 8px 30px rgba(0,0,0,.5);margin:12vh auto}
  h1{margin:0 0 12px;font-size:26px;font-weight:700;text-align:center}
  p{margin:0 0 16px;color:#bbb;font-size:15px;text-align:center}
  label{display:block;font-size:14px;color:#ccc;margin:12px 0 8px}
  input{width:100%;padding:16px 18px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;outline:none;text-align:center;letter-spacing:2px;font-weight:700;font-size:18px;box-sizing:border-box}
  input::placeholder{color:#8a8a8a}
  input:focus{border-color:#c8102e;box-shadow:none}
  .btn{margin-top:18px;width:100%;padding:16px 18px;border:none;border-radius:10px;background:#c8102e;color:#fff;font-weight:700;cursor:pointer;font-size:16px;box-sizing:border-box}
  .btn:hover{background:#ac0e29}
  .note{margin-top:14px;font-size:12px;color:#9a9a9a;text-align:center}
</style>
</head>
<body>
  <div class="intro" id="intro">
    <!-- Prefer a tiny video clip for widest TV compatibility -->
    <video id="intro-video" class="logo" autoplay muted playsinline preload="auto" poster="/static/ea-logo.svg" style="display:block; background:#0b0b0b; border-radius:8px;">
      <source src="/static/intro.mp4" type="video/mp4">
      <source src="/static/intro.webm" type="video/webm">
    </video>
    <!-- Animated SVG (fallback) -->
    <img id="intro-svg" class="logo" src="/static/ea-logo-intro.svg" alt="Everyday Advertise intro" style="display:none" />
    <!-- Fallback: static logo SVG (widely supported) -->
    <img id="intro-static" class="logo" src="/static/ea-logo.svg" alt="Everyday Advertise" style="display:none" />
    <!-- Final fallback: branded text with CSS fade/zoom -->
    <div id="intro-text" class="logo" style="display:none; font-weight:800; font-size:clamp(28px,8vw,64px); text-align:center; line-height:1.1;">
      Everyday<br/>Advertise
    </div>
  </div>
  <div class="panel" id="step1">
    <h1>Enter your Android TV pairing code</h1>
    <p>Type the 4-digit code from your TV app or profile page.</p>
    <label for="code">4-digit code</label>
    <input id="code" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="4-digit code (e.g. 1126)" />
    <button class="btn" id="go">Link Code</button>
    <div class="note">Next you'll enter the store code and pick a screen.</div>
  </div>
  <script>
    // Enforce HTTPS on our domain for some TV browsers
    try{ if (location.protocol === 'http:' && /(^|\.)everydayadvertise\.com$/i.test(location.hostname)) { location.replace('https:' + location.href.slice(5)); } }catch(e){}

    // --- Helpers (ES5-compatible) ---
    function isTizenTV(){
      var ua = '' + (navigator && navigator.userAgent || '');
      return /Tizen|TizenBrowser|SamsungBrowser|SMART-TV|SmartTV|Maple/i.test(ua);
    }
    function hideIntro(force){
      try{
        var intro = document.getElementById('intro');
        if(!intro) return;
        var hidden = intro.getAttribute('data-hidden');
        if(hidden === '1' && !force) return;
        intro.setAttribute('data-hidden','1');
        try{ intro.style.opacity='0'; intro.style.pointerEvents='none'; }catch(e){}
        setTimeout(function(){ try{ intro.style.display='none'; if(intro.parentNode){ intro.parentNode.removeChild(intro); } }catch(e){} }, 500);
        try{ var c=document.getElementById('code'); if(c && typeof c.focus==='function'){ c.focus(); } }catch(e){}
      }catch(e){}
    }
    // On Tizen, show a lightweight animated static logo, then fade out automatically
    if(isTizenTV()){
      try{
        var vid = document.getElementById('intro-video'); if(vid) vid.style.display='none';
        var svg = document.getElementById('intro-svg'); if(svg) svg.style.display='none';
        var st = document.getElementById('intro-static');
        if(st){ st.style.display='block'; st.className = (st.className||'') + ' anim-simple'; }
      }catch(e){}
      setTimeout(function(){ hideIntro(true); }, 1800);
    } else {
      // Primary 3s hide + safeties
      setTimeout(function(){ hideIntro(false); }, 3000);
      setTimeout(function(){ hideIntro(true); }, 6000);
      setTimeout(function(){ hideIntro(true); }, 9000);
    }

    // Max compatibility: video -> animated SVG -> static SVG -> text
    (function ensureIntroVisible(){
      var vidEl = document.getElementById('intro-video');
      var svgEl = document.getElementById('intro-svg');
      var staticEl = document.getElementById('intro-static');
      var textEl = document.getElementById('intro-text');
      function show(el){
        try{ if(vidEl) vidEl.style.display='none'; }catch(e){}
        try{ if(svgEl) svgEl.style.display='none'; }catch(e){}
        try{ if(staticEl) staticEl.style.display='none'; }catch(e){}
        try{ if(textEl) textEl.style.display='none'; }catch(e){}
        try{ if(el) el.style.display='block'; }catch(e){}
      }
      if(isTizenTV()){
        // Prefer static SVG with simple CSS animation on Tizen
        show(staticEl);
        try{ if(staticEl){ staticEl.className = (staticEl.className||'') + ' anim-simple'; } }catch(e){}
        return;
      }
      if(vidEl){
        var switched=false;
        function fallbackToSvg(){ if(switched) return; switched=true; show(svgEl); }
        var watchdog = setTimeout(function(){
          try{
            var ready = vidEl.readyState || 0;
            if(ready < 2 || (vidEl.duration && vidEl.currentTime===0)) fallbackToSvg();
          }catch(e){ fallbackToSvg(); }
        }, 700);
        try{
          var p = vidEl.play();
          if(p && typeof p.then==='function'){
            p.then(function(){ /* ok */ }).catch(function(){ fallbackToSvg(); });
          }
        }catch(e){ fallbackToSvg(); }
        function onTime(){ try{ if(vidEl.currentTime>=2) hideIntro(false); }catch(e){} }
        try{ vidEl.addEventListener('timeupdate', onTime); }catch(e){}
        try{ vidEl.addEventListener('ended', function(){ hideIntro(true); }); }catch(e){}
        try{ vidEl.addEventListener('error', fallbackToSvg); }catch(e){}
        try{ vidEl.addEventListener('stalled', fallbackToSvg); }catch(e){}
        try{ vidEl.addEventListener('abort', fallbackToSvg); }catch(e){}
        try{ vidEl.addEventListener('loadeddata', function(){ try{ clearTimeout(watchdog); }catch(e){} }); }catch(e){}
      }
      if(svgEl){
        try{ svgEl.addEventListener('error', function(){ show(staticEl); }); }catch(e){}
        var switched2 = false;
        var watchdog2 = setTimeout(function(){
          if(switched2) return;
          try { if(svgEl.naturalWidth === 0) { switched2=true; show(staticEl); } } catch(e) { switched2=true; show(staticEl); }
        }, 500);
        try{ svgEl.addEventListener('load', function(){ if(!switched2){ try{ clearTimeout(watchdog2); }catch(e){} } }); }catch(e){}
      }
      if(staticEl){
        try{ staticEl.addEventListener('error', function(){ show(textEl); }); }catch(e){}
        setTimeout(function(){ try{ if(staticEl.style.display!=='none' && staticEl.naturalWidth===0){ show(textEl); } }catch(e){ show(textEl); } }, 900);
      }
    })();
    try{ document.addEventListener('visibilitychange', function(){ if(!document.hidden){ setTimeout(function(){ hideIntro(false); }, 1200); } }); }catch(e){}
    (function(){ var tries=0; var id=setInterval(function(){ tries++; hideIntro(false); if(tries>=5) try{ clearInterval(id); }catch(e){} }, 2000); })();

    var codeEl = document.getElementById('code');
    try{
      codeEl.addEventListener('input', function(){ try{ codeEl.value = codeEl.value.replace(/[^0-9]/g,'').slice(0,4); }catch(e){} });
      codeEl.addEventListener('keyup', function(){ try{ codeEl.value = codeEl.value.replace(/[^0-9]/g,'').slice(0,4); }catch(e){} });
      codeEl.addEventListener('change', function(){ try{ codeEl.value = codeEl.value.replace(/[^0-9]/g,'').slice(0,4); }catch(e){} });
    }catch(e){}

    function go(){
      try{
        var c = (codeEl.value || '').replace(/\s+/g,'');
        if(!(c.length===4 && /^[0-9]{4}$/.test(c))){ alert('Please enter your 4-digit TV code.'); return; }
        var url = '/api/stores_by_code/' + encodeURIComponent(c);
        function onOk(){ try{ window.location.href = '/webplayer/store?code=' + encodeURIComponent(c); }catch(e){} }
        function onFail(msg){ alert(msg || 'TV code not valid'); }
        if(window.fetch){
          try{
            fetch(url, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){ if(j && j.success){ onOk(); } else { onFail(j && j.error); } }).catch(function(){ onFail('Could not verify code. Check your connection.'); });
          }catch(e){ onFail('Could not verify code.'); }
        } else {
          try{
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function(){ if(xhr.readyState===4){ try{ var j = JSON.parse(xhr.responseText); if(j && j.success){ onOk(); } else { onFail(j && j.error); } }catch(e){ onFail('Could not verify code.'); } } };
            xhr.onerror = function(){ onFail('Network error.'); };
            xhr.send();
          }catch(e){ onFail('Could not verify code.'); }
        }
      }catch(e){ alert('Unexpected error.'); }
    }
    try{ document.getElementById('go').addEventListener('click', go); }catch(e){}
    try{ document.addEventListener('keydown', function(e){ e=e||window.event; if((e.key||e.keyCode)==='Enter' || e.keyCode===13){ go(); } }); }catch(e){}
  </script>
</body>
</html>
