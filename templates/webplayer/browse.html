<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Screen</title>
  <style>
    html,body{height:100%;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;background:#0b0b0b;color:#f4f4f4;display:flex;flex-direction:column}
    header{padding:14px 16px;background:#111;border-bottom:1px solid #222}
    header .code{font-weight:700;letter-spacing:3px}
    main{flex:1;display:flex;gap:18px;padding:16px}
    .panel{flex:1;background:#141414;border:1px solid #242424;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
    .panel h2{margin:0;padding:12px 14px;border-bottom:1px solid #242424;font-size:16px;background:#161616}
    ul{list-style:none;margin:0;padding:0}
    li{border-bottom:1px solid #1f1f1f}
    li button{width:100%;text-align:left;background:transparent;border:0;color:#ddd;padding:16px 16px;font-size:18px;cursor:pointer}
    li button:hover, li button:focus{background:#1a1a1a;outline:none}
  </style>
</head>
<body>
  <header>
    <div>TV code: <span class="code" id="code"></span> • Store: <span id="store"></span></div>
  </header>
  <main>
    <div class="panel" style="flex:1.2">
      <h2>Screens</h2>
      <ul id="screens" class="screens"></ul>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code') || '';
    const storeId = (params.get('store_id')||'').trim();
    document.getElementById('code').textContent = code;
    document.getElementById('store').textContent = storeId || '-';
    if(!(code.length===4 && /^[0-9]{4}$/.test(code)) || !storeId){ location.href = '/webplayer'; }

    const screensEl = document.getElementById('screens');
    let data = null;

    function el(tag, attrs={}, text=''){
      const e = document.createElement(tag);
      for(const [k,v] of Object.entries(attrs)){ e.setAttribute(k, v); }
      if(text) e.textContent = text;
      return e;
    }

    function renderScreens(){
      screensEl.innerHTML = '';
      const sc = (data && data.screens && data.screens[storeId]) ? data.screens[storeId] : {};
      const entries = Object.entries(sc);
      if(!entries.length){
        const li = el('li'); li.appendChild(el('button',{},'No screens found for this store')); screensEl.appendChild(li); return;
      }
      for(const [sid, obj] of entries){
        const li = el('li');
        const btn = el('button');
        btn.textContent = `${sid}${obj && obj.name ? ' — '+obj.name : ''}`;
        btn.addEventListener('click', ()=>{
          const q = new URLSearchParams({ store_id: storeId, screen_id: sid, code });
          location.href = '/webplayer/play?' + q.toString();
        });
        li.appendChild(btn); screensEl.appendChild(li);
      }
      const first = screensEl.querySelector('button'); if(first) first.focus();
    }

    (async function init(){
      try{
        const r = await fetch(`/api/stores_by_code/${encodeURIComponent(code)}`, { cache:'no-store' });
        data = await r.json();
        if(!data || !data.success){ alert(data && data.error ? data.error : 'Code invalid'); location.href = '/webplayer'; return; }
        renderScreens();
      }catch(e){ alert('Failed to load screens for this code'); location.href = '/webplayer'; }
    })();
  </script>
</body>
</html>
