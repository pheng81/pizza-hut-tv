				this.storeId = storeId;
				this.screenId = screenId;
				this.syncTargets = new Map(); // Other screens in sync group
				this.masterClock = Date.now();
				this.syncTolerance = 10; // 10ms tolerance for ultra-precise sync
				this.transitionQueue = [];
				this.lastSyncTime = 0;
				
				// SYNCHRONIZED SCREEN TIMING: All screens start at aligned intervals
				this.getScreenSyncOffset = () => {
					// Extract screen number for sync calculations
					const screenMatch = screenId.match(/screen(\d+)$/);
					const screenNum = screenMatch ? parseInt(screenMatch[1]) : 1;
					// All screens sync to same timeline - no offset needed for true sync
					return 0; // All screens start simultaneously
				};
				
				console.log('🚀 Professional Sync Coordinator initialized for', screenId, 'with sync offset:', this.getScreenSyncOffset());
			}
			
			// Enterprise-style frame-perfect sync
			scheduleSync(item, targetTime) {
				const now = Date.now();
				const delay = Math.max(0, targetTime - now);
				
				console.log('⏱️ Scheduling sync transition in', delay, 'ms for perfect alignment');
				
				return new Promise(resolve => {
					setTimeout(() => {
						this.executeSyncTransition(item);
						resolve();
					}, delay);
				});
			}
			
			// Professional black-screen elimination
			executeSyncTransition(item) {
				console.log('🎬 Executing PROFESSIONAL sync transition - NO BLACK SCREENS');
				
				// Add transitioning class for anti-black-screen effect
				front.classList.add('transitioning');

				// Immediate transition with professional timing
				setTimeout(() => {
					front.classList.remove('transitioning');
					back.classList.remove('transitioning');
				}, 100); // Brief anti-black-screen protection
			}
			
			// Calculate perfect sync timing like industry systems
			calculateSyncMoment(duration) {
				// GLOBAL SYNC FIX: All screens sync to server timestamp instead of local time
				// This ensures perfect synchronization across all screens
				const serverTime = window.serverTimestamp || Date.now();
				const syncInterval = 2000; // 2 second sync intervals for all screens
				const nextSync = Math.ceil(serverTime / syncInterval) * syncInterval;
				
				console.log('🎯 GLOBAL SYNC: All screens syncing to timestamp', nextSync);
				return nextSync;
			}
			
			// Get server timestamp for global sync
			async getServerTime() {
				try {
					const response = await fetch('/api/sync-time');
					const data = await response.json();
					window.serverTimestamp = data.timestamp;
					return data.timestamp;
				} catch (error) {
					console.warn('Server time sync failed, using local time');
					return Date.now();
				}
			}
		}
		
		// Expose globally so later scripts can instantiate after params resolved
		window.SyncCoordinator = SyncCoordinator;

	const screenNumber = getScreenNumber(screenId);

	// Optional display control via query param: ?fit=cover|contain

		const DEFAULT_ORIGIN = 'https://api.everydayadvertise.com';

		try{ if (location.protocol === 'http:' && /(^|\.)everydayadvertise\.com$/i.test(location.hostname)) { location.replace('https:' + location.href.slice(5)); } }catch{}

		const videoExt = ['mp4','webm','ogg','mov','avi','mkv','m4v'];
		function extFromName(name){ if(!name) return ''; const n=String(name); const base=n.split('?')[0].split('#')[0]; return (base.split('.').pop()||'').toLowerCase(); }
		function isVideoByName(name){ if(!name) return false; return videoExt.includes(extFromName(name)); }
		function fileNameFrom(item){

		const SYNC_ALIGNMENT_WINDOW_MS = 50; // 50ms sync window - reasonable tolerance
		const SYNC_PRECISION_TOLERANCE = 30; // 30ms precision tolerance for good sync
		
		// Server time synchronization variables
		let serverTimeOffset = 0; // Offset between server and client time
		let lastServerSync = 0;
		let syncSamples = []; // Store multiple samples for better accuracy
		let networkLatency = 0; // Estimated network latency
		
		// SERVER TIME SYNC - Re-sync every 10 seconds for stable sync
		async function getServerTime() {
			const maxRetries = 3; // Reasonable retry count
			const samples = [];
			
			for(let attempt = 0; attempt < maxRetries; attempt++) {
				try {
					const startTime = performance.now();
					const response = await fetch('/api/server_time', { 
						cache: 'no-cache',
						headers: { 'Cache-Control': 'no-cache' }
					});
					const requestLatency = performance.now() - startTime;
					
					if(!response.ok) {
						throw new Error(`HTTP ${response.status}`);
					}
					
					const data = await response.json();
					const clientTime = Date.now();
					const serverTime = data.server_time_ms;
					
					// Compensate for network latency (half of round-trip time)
					const adjustedServerTime = serverTime + (requestLatency / 2);
					const offset = adjustedServerTime - clientTime;
					
					samples.push({
						offset: offset,
						latency: requestLatency,
						timestamp: clientTime
					});
					
					console.log(`🌐 SERVER TIME SAMPLE ${attempt + 1}:`, {
						server: serverTime,
						client: clientTime,
						latency: requestLatency.toFixed(1) + 'ms',
						offset: offset.toFixed(3) + 'ms',
						screenId: screenId
					});
					
				} catch(err) {
					console.warn(`Server time sync attempt ${attempt + 1} failed:`, err);
					if(attempt === maxRetries - 1) {
						console.warn('All server time sync attempts failed, using client time');
						return Date.now();
					}
					// Wait before retry
					await new Promise(resolve => setTimeout(resolve, 100));
				}
			}
			
			if(samples.length > 0) {
				// Calculate median offset for better accuracy
				const offsets = samples.map(s => s.offset).sort((a, b) => a - b);
				const medianOffset = offsets[Math.floor(offsets.length / 2)];
				
				// Calculate average latency
				const avgLatency = samples.reduce((sum, s) => sum + s.latency, 0) / samples.length;
				
				serverTimeOffset = medianOffset;
				networkLatency = avgLatency;
				lastServerSync = Date.now();
				
				// Store samples for trend analysis
				syncSamples.push({
					offset: medianOffset,
					latency: avgLatency,
					timestamp: lastServerSync
				});
				
				// Keep only last 10 samples
				if(syncSamples.length > 10) {
					syncSamples = syncSamples.slice(-10);
				}
				
				console.log('🌐 FINAL SERVER TIME SYNC:', {
					medianOffset: medianOffset.toFixed(3) + 'ms',
					avgLatency: avgLatency.toFixed(1) + 'ms',
					samples: samples.length,
					screenId: screenId
				});
				
				return Date.now() + medianOffset;
			}
			
			return Date.now(); // Fallback
		}
		
		function getServerSyncedTime() {
			const clientTime = Date.now();
			
			// Re-sync every 10 seconds for stable coordination
			if(clientTime - lastServerSync > 10000) { // Re-sync every 10 seconds
				getServerTime(); // Async refresh for next time
			}
			
			// Apply drift compensation if we have multiple samples
			let adjustedOffset = serverTimeOffset;
			if(syncSamples.length >= 3) {
				// Calculate drift trend from recent samples
				const recent = syncSamples.slice(-5);
				const oldestTime = recent[0].timestamp;
				const newestTime = recent[recent.length - 1].timestamp;
				const oldestOffset = recent[0].offset;
				const newestOffset = recent[recent.length - 1].offset;
				
				if(newestTime > oldestTime) {
					const driftRate = (newestOffset - oldestOffset) / (newestTime - oldestTime);
					const timeSinceLastSync = clientTime - lastServerSync;
					adjustedOffset = serverTimeOffset + (driftRate * timeSinceLastSync);
					
					// Log drift compensation occasionally
					if(Math.abs(driftRate) > 0.001 && Math.random() < 0.1) {
						console.log('🔄 Clock drift compensation:', {
							drift: (driftRate * 1000).toFixed(6) + 'ms/s',
							adjustment: (driftRate * timeSinceLastSync).toFixed(3) + 'ms',
							screenId: screenId
						});
					}
				}
			}
			
			return clientTime + adjustedOffset;
		}

		async function stableSyncWait(syncGroup, activeScreenId) {
			try {
				if ((Date.now() - lastServerSync) > 2000) {
					await getServerTime();
				}
			} catch (err) {
				console.warn('⚠️ Sync wait pre-refresh failed:', err);
			}

			const serverTime = getServerSyncedTime();
			const syncIntervalMs = 1000;
			const nextSyncMoment = Math.ceil((serverTime + SYNC_WARMUP_MS) / syncIntervalMs) * syncIntervalMs;
			const waitTime = Math.max(0, nextSyncMoment - serverTime);

			console.log(`🎯 STABLE SYNC WAIT [${activeScreenId}]`, {
				group: syncGroup,
				wait: Math.round(waitTime),
				nextSync: new Date(nextSyncMoment).toISOString(),
				serverOffset: Number(serverTimeOffset || 0).toFixed(3) + 'ms'
			});

			if (waitTime > 0) {
				await new Promise((resolve) => setTimeout(resolve, waitTime));
			}
		}
		
		const SYNC_WARMUP_MS = 150;
		async function computeSyncDelayMs(item){
			if(!item || !item.sync_ref){
				return { startDelay: 0, intervalMs: 0, clockSkew: 0, halfRtt: 0 };
			}
			const syncGroup = item.sync_ref.group || 'default';
			const requestSentAtPerf = performance.now();
			const requestSentAtWall = Date.now();
			try{
				const response = await fetch('/api/sync-time', { cache: 'no-store', headers: { 'Cache-Control': 'no-store' } });
				const responseReceivedAtPerf = performance.now();
				if(!response.ok){
					throw new Error(`HTTP ${response.status}`);
				}
				const payload = await response.json();
				const halfRtt = Math.max(0, (responseReceivedAtPerf - requestSentAtPerf) / 2);
				const intervalRaw = Number(payload.sync_interval ?? payload.syncInterval ?? 0);
				const intervalMs = Number.isFinite(intervalRaw) && intervalRaw > 0 ? intervalRaw : 0;
				const delayRaw = Number(payload.delay_ms ?? payload.delayMs ?? 0);
				const serverDelay = Number.isFinite(delayRaw) ? delayRaw : 0;
				let serverCurrent = Number(payload.current_time ?? payload.currentTime ?? 0);
				if(!Number.isFinite(serverCurrent) || serverCurrent === 0){
					const ts = Number(payload.timestamp ?? 0);
					if(Number.isFinite(ts) && ts !== 0 && Number.isFinite(serverDelay)){
						serverCurrent = ts - serverDelay;
					} else {
						serverCurrent = 0;
					}
				}
				const approxLocalAtResponse = requestSentAtWall + halfRtt;
				const clockSkew = serverCurrent ? (approxLocalAtResponse - serverCurrent) : 0;
				let candidate = serverDelay - halfRtt - SYNC_WARMUP_MS - clockSkew;
				if(intervalMs > 0 && candidate < 0){
					const missed = Math.floor(Math.abs(candidate) / intervalMs) + 1;
					candidate += missed * intervalMs;
				}
				const startDelay = Math.max(0, Math.round(candidate));
				console.log(`🎯 [${screenId}] sync window`, {
					group: syncGroup,
					startDelay,
					intervalMs,
					halfRtt: Math.round(halfRtt),
					clockSkew: Math.round(clockSkew)
				});
				return { startDelay, intervalMs, clockSkew, halfRtt };
			}catch(err){
				console.warn(`⚠️ [${screenId}] sync delay fetch failed for group ${syncGroup}`, err);
				return { startDelay: 0, intervalMs: 0, clockSkew: 0, halfRtt: 0 };
			}
		}

		async function alignToSyncWindow(item, durationSec){
			const syncGroup = item && item.sync_ref && item.sync_ref.group ? item.sync_ref.group : 'default';

		function calculateSyncedVideoTime(item) {
			try {
				if(!item || !item.sync_ref) return null;
				const startEpochSec = Number(item.sync_ref.start_epoch || item.sync_ref.startEpoch);
				const duration = Number(item.duration || 10);
				if(!Number.isFinite(startEpochSec) || !Number.isFinite(duration)) return null;
				
				// Use server-synchronized time for perfect cross-screen video timing
				const now = getServerSyncedTime();
				const baseMs = startEpochSec * 1000;
				const elapsed = now - baseMs;
				const videoTime = (elapsed / 1000) % duration;
				
				console.log('🎯 SERVER-SYNCED VIDEO TIME CALC:', {
					serverTime: now.toFixed(3),
					baseMs: baseMs,
					elapsed: elapsed.toFixed(3),

				});
				
				return Math.max(0, videoTime);
			} catch(err) {
				console.warn('calculateSyncedVideoTime error:', err);
				return null;
			}
		}

	function startSyncMonitoring(videoElement, item) {
		if(!videoElement || !item || !item.sync_ref) return;
		
		let syncCheckInterval;
		let lastCorrectionTime = 0;
		const SYNC_CHECK_INTERVAL = 250; // Check every 250ms (4x per second) - more frequent
		const HARD_SYNC_THRESHOLD = 0.3; // Hard sync if >300ms drift (tighter)
		const MICRO_ADJUST_THRESHOLD = 0.1; // Gentle correction if >100ms drift (more responsive)
		const CORRECTION_COOLDOWN = 2000; // 2 seconds between corrections (faster)
		
		// 🎯 TIGHTER SYNC: More aggressive corrections for perfect synchronization
		// Uses TINY playback rate changes (1.03x/0.97x) for faster correction
		
		const checkSync = () => {
			try {
				if(!document.body.contains(videoElement) || videoElement.paused || videoElement.ended) {
					console.log('🔄 Stopping sync monitoring - video stopped or removed');
					clearInterval(syncCheckInterval);
					return;
				}
				
				const expectedTime = calculateSyncedVideoTime(item);
				if(expectedTime === null) return;
				
				const actualTime = videoElement.currentTime;
				const drift = Math.abs(actualTime - expectedTime);
				const isBehind = actualTime < expectedTime;
				const now = Date.now();
				const timeSinceLastCorrection = now - lastCorrectionTime;
				
				// HARD SYNC for major drift (>300ms)
				if(drift > HARD_SYNC_THRESHOLD && timeSinceLastCorrection > CORRECTION_COOLDOWN) {
					console.log('🔄 HARD SYNC (>300ms):', {
						screen: screenId,
						expected: expectedTime.toFixed(3),
						actual: actualTime.toFixed(3),
						drift: (drift * 1000).toFixed(0) + 'ms'
					});
					
					videoElement.currentTime = expectedTime;
					videoElement.playbackRate = 1.0;
					lastCorrectionTime = now;
					
				// MICRO-ADJUSTMENT for medium drift (100-300ms)
				// Uses 3% speed change for faster correction
				} else if(drift > MICRO_ADJUST_THRESHOLD && timeSinceLastCorrection > CORRECTION_COOLDOWN) {
					const adjustment = isBehind ? 1.03 : 0.97; // 3% change (faster correction)
					videoElement.playbackRate = adjustment;
					lastCorrectionTime = now;
					
					console.log('⚡ Micro-adjustment (100-300ms):', {
						screen: screenId,
						rate: adjustment,
						drift: (drift * 1000).toFixed(0) + 'ms',
						direction: isBehind ? 'catch up' : 'slow down'
					});
					
					// Reset to 1.0 after 1.5 seconds (faster reset)
					setTimeout(() => {
						if(videoElement && document.body.contains(videoElement)) {
							videoElement.playbackRate = 1.0;
						}
					}, 1500);
					
				// GOOD SYNC (<100ms) - maintain normal speed
				} else {
					if(videoElement.playbackRate !== 1.0) {
						videoElement.playbackRate = 1.0;
					}
					// Log occasionally
					if(Math.random() < 0.02) {
						console.log('📊 Sync status:', {
							screen: screenId,
							drift: (drift * 1000).toFixed(0) + 'ms',
							status: drift < 0.05 ? '✅ Perfect' : drift < 0.1 ? '✔️ Good' : '⚠️ Adjusting'
						});
					}
				}
			} catch(err) {
				console.warn('Sync monitoring error:', err);
			}
		};			// Start monitoring after 1 second delay
			setTimeout(() => {
				syncCheckInterval = setInterval(checkSync, SYNC_CHECK_INTERVAL);
				console.log('� Sync monitoring started for', screenId);
			}, 1000);
		}

		function normalizeSliceUrl(rawUrl, item){
			if(!rawUrl) return rawUrl;
			try {
				const desiredOrder = determineSliceOrder(item);
				if(desiredOrder === null) return rawUrl;
				const hasProtocol = /^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(rawUrl);
				const base = (hasProtocol ? undefined : (window.location && window.location.origin ? window.location.origin : ORIGIN));
				const urlObj = new URL(rawUrl, base || ORIGIN);
				const current = parseInt(urlObj.searchParams.get('slice_order') || '', 10);
				if(Number.isNaN(current) || current !== desiredOrder){
					urlObj.searchParams.set('slice_order', desiredOrder);
					console.log('Adjusted slice_order to match screen order:', { from: Number.isNaN(current) ? 'none' : current, to: desiredOrder, url: urlObj.toString() });
				}
				return urlObj.toString();
			}catch(err){
				console.warn('Failed to normalize slice URL', rawUrl, err);
				return rawUrl;
			}
		}

		function ensureVideoPlaying(video, contextLabel){
			if(!video) return;
			let attempts = 0;
			const maxAttempts = 6;
			const attemptDelay = 320;
			function attemptPlayback(){
				if(!document.body.contains(video)){
					return;
				}
				if(!video.paused && video.readyState >= 2){
					console.log('✅ Video confirmed playing', {
						label: contextLabel || 'unknown',
						readyState: video.readyState,
						currentTime: video.currentTime
					});
					return;
				}
				attempts += 1;
				console.log('⚠️ Video not yet playing, retrying...', {
					label: contextLabel || 'unknown',
					readyState: video.readyState,
					networkState: video.networkState,
					paused: video.paused,
					attempt: attempts
				});
				try {
					const playPromise = video.play();
					if(playPromise && playPromise.catch){
						playPromise.catch(err => console.warn('Retry play rejected', err));
					}
				}catch(err){
					console.warn('Retry play threw error', err);
				}
				if(attempts < maxAttempts){
					setTimeout(attemptPlayback, attemptDelay);
				}else{
					console.error('❌ Video failed to enter playing state after retries', {
						label: contextLabel || 'unknown',
						readyState: video.readyState,
						networkState: video.networkState
					});
				}
			}
			attemptPlayback();
		}

		function waitForFirstFramePaint(video, timeoutMs = 1500){
			return new Promise(resolve => {
				let done = false;

					try{
						video.removeEventListener('timeupdate', onTU);
						video.removeEventListener('playing', onPlaying);
						video.removeEventListener('seeked', onSeeked);
					}catch{}
				};
				const onTU = () => { try{ if(video.currentTime > 0){ finish(); } }catch{} };

					requestAnimationFrame(() => { if(!done){ /* no-op, rAF gives a paint chance */ } });
				};
				const onPlaying = () => {
					try{
						if(typeof video.requestVideoFrameCallback === 'function'){

							video.requestVideoFrameCallback(() => finish());
							return;
						}
					}catch{}
					// Fallback: allow two RAFs to ensure a paint occurred
					requestAnimationFrame(() => requestAnimationFrame(finish));
				};

					video.addEventListener('timeupdate', onTU);
					video.addEventListener('playing', onPlaying, { once:true });
					video.addEventListener('seeked', onSeeked, { once:true });
				}catch{}

				setTimeout(finish, timeoutMs);
			});

		function insertPanelSoftBreaks(text, maxTokenLength = 14){
			const source = String(text || '');
			if(!source.trim()) return source;
			let tokenRun = 0;
			let output = '';
			for(const char of source){
				output += char;
				if(/\s/.test(char)){
					tokenRun = 0;
					continue;
				}
				if(char === '/' || char === '-' || char === '_' || char === '#'){
					output += '\u200b';
					tokenRun = 0;
					continue;
				}
				tokenRun += 1;
				if(tokenRun >= maxTokenLength){
					output += '\u200b';
					tokenRun = 0;
				}
			}
			return output;
		}

		// Client-side schedule filtering (matches server logic)
		function isItemActiveNow(item){
			try{
				// Check if item is enabled
				if(item.enabled === false){
					console.log('🔍 Item DISABLED:', item.name || item.id);
					return false;
				}
				
				// Get current local time
				const now = new Date();
				const currentDay = ['sun','mon','tue','wed','thu','fri','sat'][now.getDay()];
				const currentTime = now.getHours() * 100 + now.getMinutes(); // e.g. 14:30 = 1430
				
				console.log('🔍 Checking item:', item.name || item.id, {
					currentDay,
					currentTime,
					hasSchedule: !!item.schedule,
					scheduleLength: (item.schedule || []).length,
					hasLegacy: !!(item.start || item.end || (item.days && item.days.length))
				});
				
				// Check multiple schedule windows (priority)
				const scheduleWindows = item.schedule || [];
				if(scheduleWindows.length > 0){
					console.log('🔍 Checking', scheduleWindows.length, 'schedule windows for:', item.name || item.id);
					for(const window of scheduleWindows){
						if(window.enabled === false){
							console.log('  ❌ Window disabled');
							continue;
						}
						
						// Check days
						const days = window.days || [];
						console.log('  🗓️ Window days:', days, 'current:', currentDay);
						if(days.length > 0 && !days.includes(currentDay)){
							console.log('  ❌ Day mismatch');
							continue;
						}
						
						// Check time range
						const start = window.start; // "HH:MM:SS" format
						const end = window.end;
						if(start || end){
							const startNum = start ? parseInt(start.replace(/:/g,'').substring(0,4)) : 0;
							const endNum = end ? parseInt(end.replace(/:/g,'').substring(0,4)) : 2359;
							console.log('  ⏰ Time range:', start, '-', end, '(', startNum, '-', endNum, ') current:', currentTime);
							if(currentTime < startNum || currentTime > endNum){
								console.log('  ❌ Time out of range');
								continue;
							}
						}
						
						// This window is active
						console.log('  ✅ WINDOW ACTIVE!');
						return true;
					}
					// No active windows
					console.log('❌ NO ACTIVE WINDOWS for:', item.name || item.id);
					return false;
				}
				
				// Check legacy single start/end window
				const start = item.start;
				const end = item.end;
				const days = item.days || [];
				
				if(start || end || days.length > 0){
					console.log('🔍 Legacy schedule:', {start, end, days});
					// Check days
					if(days.length > 0 && !days.includes(currentDay)){
						console.log('❌ Legacy day mismatch');
						return false;
					}
					
					// Check time range
					if(start || end){
						const startNum = start ? parseInt(start.replace(/:/g,'').substring(0,4)) : 0;
						const endNum = end ? parseInt(end.replace(/:/g,'').substring(0,4)) : 2359;
						console.log('⏰ Legacy time:', startNum, '-', endNum, 'current:', currentTime);
						if(currentTime < startNum || currentTime > endNum){
							console.log('❌ Legacy time out of range');
							return false;
						}
					}
				}
				
				// No schedule restrictions or within active window
				console.log('✅ ACTIVE (no restrictions or legacy match):', item.name || item.id);
				return true;
			}catch(err){
				console.warn('Schedule check error:', err);
				return true; // Default to active if check fails
			}
		}

		async function primePreload(item){
			try{
				if(!item) return; const url = mediaUrl(item); if(!url) return;
				if(cacheGet(url)) return; // already primed
				// Prefer extension-based detection; only trust media_type as a last resort when URL doesn't look like an image
				const isVid = (
					isVideoByName(url) ||
					isVideoByName(fileNameFrom(item)) ||
					(((item.media_type||'').toLowerCase()==='video') && !/\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(String(url)))
				);
				const node = isVid ? await preloadVideo(url) : await preloadImage(url);
				cachePut(url, { node, type: isVid?'video':'image', ts: Date.now() });
			}catch{}
		}

		function keyFrom(item){
			try{
				if(!item) return '';
				if(item.id) return `id:${item.id}`;
				const f = (item.url || item.file || '').toString();
				if(f) return `f:${f.split('?')[0]}`;
				return `n:${fileNameFrom(item)}`;
			}catch{ return ''; }
		}

		let orientationMode = 'default'; // 'vertical' | 'horizontal' | 'default'
		let displayRotation = 0; // 0|90|180|270
		function applyOrientation(){
			try{
				// Base rotation from orientation
				let rot = (orientationMode === 'vertical') ? 90 : 0;
				let total = ((rot + (Number(displayRotation)||0)) % 360 + 360) % 360;
				
				// Get viewport dimensions
				const vw = window.innerWidth || document.documentElement.clientWidth || 1920;
				const vh = window.innerHeight || document.documentElement.clientHeight || 1080;
				
				// Calculate scale to FILL screen (like Pi client - no letterboxing)
				let scale = 1;
				if (total % 180 === 90) {
					// Portrait orientation on landscape screen (or vice versa)
					// Scale to ensure content fills the screen completely
					scale = Math.max(vw/vh, vh/vw);
				}
				
				// Apply transforms
				const parts = [`rotate(${total}deg)`];
				if (scale !== 1) { 
					parts.push(`scale(${scale.toFixed(5)})`); 
				}
				stage.style.transform = parts.join(' ');
				stage.style.transformOrigin = 'center center';
				
				console.log(`📐 Orientation applied: mode=${orientationMode}, rotation=${displayRotation}°, total=${total}°, scale=${scale.toFixed(3)}`);
			}catch(e){
				console.error('❌ Orientation error:', e);
			}
		}

		async function fetchPlaylist(forceAdvanceOnChange = false){
			try{
				const qs = new URLSearchParams();
				if(pairCode) qs.set('user_code', pairCode);
				// Server now handles schedule filtering (supports mm/dd/yyyy format)
				// Server filtering is more accurate with full datetime support
				// Client still does secondary check for safety
				const r = await fetch(`${ORIGIN}/playlist/${encodeURIComponent(storeId)}/${encodeURIComponent(screenId)}?`+qs.toString(), { cache:'no-store', headers: pairCode?{'X-User-Code': pairCode}:{}});
				const j = await r.json();
				if(j && j.success && Array.isArray(j.playlist)){
					const newSignature = computePlaylistSignature(j.playlist, j.orientation, j.rotation);
					const signatureChanged = Boolean(playlistSignature) && newSignature !== playlistSignature;
					playlist = j.playlist;
					panelZoneState = j.panel_zone || { enabled:false, layout_mode:'off', playlist:[], active_item:null };
					playlistSignature = newSignature;
					if(typeof j.orientation === 'string'){ orientationMode = j.orientation; }
					if(typeof j.rotation === 'number'){ displayRotation = (j.rotation||0); }
					if(typeof j.muted === 'boolean'){ screenMuted = j.muted; }
					applyOrientation();
					renderPanelZone(currentMainItem);
					if(idx >= playlist.length) idx = 0;
					// If the currently showing item is no longer present (e.g., schedule switch), advance immediately
					if(currentItemKey){
						const stillPresent = playlist.some(it => keyFrom(it) === currentItemKey);
						if(!stillPresent && playlist.length){
							forceAdvanceNow = true;
							if(timer){ clearTimeout(timer); timer = null; }
							setTimeout(()=>{ if(!timer) tick(); }, 0);
						}
					}
					if(signatureChanged && playlist.length && forceAdvanceOnChange){
						forceAdvanceNow = true;
						idx = 0;
						if(timer){ clearTimeout(timer); timer = null; }
						setTimeout(()=>{ if(!timer) tick(); }, 0);
					}
				}
			}catch(e){ overlay.textContent = `Playlist error: ${e&&e.message||'unknown'}`; }
			lastFetchTs = Date.now();
			if(!playlist.length){
				currentMainItem = null;
				const panelVisible = renderPanelZone(null);
				if(panelVisible){
					hideIdleState();
				}else{
					showIdleState('Waiting for schedule…');
				}
			}else{
				hideIdleState();
			}
		}

		async function pollCommands(){

		function preloadImage(url){ 
			return new Promise((resolve,reject)=>{ 
				// 🎬 YOUTUBE: Skip preloading for YouTube videos (they use iframes, not images)
				if (url && url.match(/youtube:[a-zA-Z0-9_-]{11}/)) {
					console.log('▶️ [PRELOAD] Skipping YouTube video (uses iframe):', url);
					resolve(null);
					return;
				}
				
				console.log('🖼️ [PRELOAD] Starting image preload for:', url);
				const img=new Image(); 
				let to=setTimeout(()=>{
					img.onload=null;
					img.onerror=null;
					console.error('❌ [IMAGE ERROR] Image timeout after 6s:', url);
					reject(new Error('image timeout'));
				},6000); 
				img.onload=()=>{
					clearTimeout(to);
					console.log('✅ [IMAGE] Image loaded successfully:', url);
					resolve(img);
				}; 
				img.onerror=(e)=>{
					clearTimeout(to);
					console.error('❌ [IMAGE ERROR] Failed to load:', url);
					console.error('❌ [IMAGE ERROR] Error:', e);
					console.error('❌ [IMAGE ERROR] naturalWidth:', img.naturalWidth, 'naturalHeight:', img.naturalHeight);
					reject(e||new Error('image error'));
				}; 
				// Only enable CORS when loading from the same origin; setting this for
				// third-party hosts (like the CDN) will cause the browser to REQUIRE
				// CORS headers and the load will fail. Leaving it unset allows images
				// to display normally without canvas access.
				try{
					const u = new URL(url);
					const cur = new URL(ORIGIN);
					if(u.host === cur.host){ img.crossOrigin = 'anonymous'; }
				}catch{}
				
				img.src=url; 
				console.log('🖼️ [PRELOAD] Image src set, waiting for load...');
			}); 
		}
		function videoMimeFrom(url){

				case 'ogv': case 'ogg': return 'video/ogg';
				case 'm3u8': return 'application/x-mpegURL';
				case 'avi': return 'video/x-msvideo';
				case 'mkv': return 'video/x-matroska';
				default: return '';
			}
		}

		function tryPlayWithPrompt(video){
			try{
				var p = video.play();
				if(p && p.then){
					p.catch(function(){
						// Autoplay blocked. Prompt user to press OK/Enter.
						var msgShown=false;
						function showMsg(){ if(msgShown) return; msgShown=true; overlay.textContent = `${overlay.textContent} • Press OK/Enter to start`; }
						function clearMsg(){ overlay.textContent = overlay.textContent.replace(/\s•\sPress OK\/Enter to start$/,''); }
						function handler(){
							window.removeEventListener('keydown', onKey);
							window.removeEventListener('click', handler);
							window.removeEventListener('touchstart', handler);
							clearMsg(); try{ video.play().catch(function(){}); }catch(e){}
						}
						function onKey(ev){ var k=ev && (ev.key||ev.keyCode); if(k==='Enter'||k===13||k===32){ handler(); } }
						showMsg();
						window.addEventListener('keydown', onKey);
						window.addEventListener('click', handler);
						window.addEventListener('touchstart', handler);
					});
				}
			}catch(e){}
		}

		function computeSegmentStyles(node, item, options={}){
			try{
				const sref = item && item.sync_ref || {};
				const mode = (sref.mode||'').toLowerCase();
				let count = parseInt(sref.count||0, 10);
				if(!Number.isNaN(count) && count >= 0){
					count = Math.min(count, 4); // Limit to 4 segments for performance
				}else{
					count = 0;
				}
				let order = determineSliceOrder(item);
				const orderSource = order !== null ? 'determineSliceOrder' : 'fallback';
				if(order === null){
					order = screenNumber > 0 ? screenNumber - 1 : 0;
				}
				if(count > 0){
					order = Math.max(0, Math.min(order, count-1));
				}
				console.log('🎯 SLICE ORDER CALCULATION:', {
					screenId: screenId,
					screenNumber: screenNumber,
					syncRef_order: sref.order,
					calculated_order: order,
					order_source: orderSource,
					count: count
				});
				const hasSliceUrl = !!(item && item.slice_url);
				const videoElement = (node && node.tagName === 'VIDEO') ? node : null;
				const shouldSegment = count > 1 && (mode === 'split-h' || mode === 'split-v');

					screenNumber: screenNumber,

					syncRef: sref,
					mode: mode,
					count: count,
					order: order,
					shouldSegment: shouldSegment,
					itemKeys: item ? Object.keys(item) : 'no item'

				node.__segmentItem = item;
				if(options.host){ node.__segmentHost = options.host; }
				if(videoElement && !options.skipMetadataHook && !videoElement.__segmentMetadataHandler){
					const metaHandler = () => {
						try{
							videoElement.dataset.videoWidth = String(videoElement.videoWidth || 0);
							videoElement.dataset.videoHeight = String(videoElement.videoHeight || 0);
							console.log('📐 Segment metadata captured:', {

									? (videoElement.videoWidth / videoElement.videoHeight).toFixed(3)

						const rawHeight = videoElement.videoHeight || parseInt(videoElement.dataset.videoHeight || '0', 10) || 0;
						if(rawWidth && rawHeight){
							const aspect = rawWidth / Math.max(1, rawHeight);
							const inverseAspect = rawHeight / Math.max(1, rawWidth);
							if(mode === 'split-h' && aspect >= 2.2){
								needClientCrop = true;
								console.log('⚙️ Client-side segment enforcement (wide aspect)', { aspect, rawWidth, rawHeight });
							}
							if(mode === 'split-v' && inverseAspect >= 2.2){

					node.style.mozTransform = '';
					node.style.oTransform = '';
					node.style.transform = '';
					node.style.webkitTransformOrigin = '';
					node.style.mozTransformOrigin = '';
					node.style.oTransformOrigin = '';

					node.style.left = '';
					node.style.width = '';

						inner.style.mozTransform = transformValue;
						inner.style.oTransform = transformValue;

							screen: screenNumber,
							order: order,
							count: count,
							transform: transformValue,
							mode: mode
						});

				clearNode(targetHost);
				targetHost.appendChild(root);

		}

		function nextIndex(){ 
			if(!playlist.length) return 0; 
			// Filter to only active items based on schedule
			const activePlaylist = playlist.filter(isItemActiveNow);
			if(!activePlaylist.length) return 0;
			
			// Find current item in active playlist
			const currentKey = currentItemKey;
			let currentActiveIdx = -1;
			if(currentKey){
				currentActiveIdx = activePlaylist.findIndex(item => keyFrom(item) === currentKey);
			}
			
			// Return next active item index in original playlist
			const nextActiveIdx = (currentActiveIdx + 1) % activePlaylist.length;
			const nextItem = activePlaylist[nextActiveIdx];
			return playlist.findIndex(item => keyFrom(item) === keyFrom(nextItem));
		}

					fetchPlaylist().catch(fetchErr => console.warn('Playlist refresh failed', fetchErr));
				}
				if(timer){ clearTimeout(timer); }
				timer = setTimeout(tick, Math.max(1, Math.round(dur * 1000)));
				return;
			}
			const singleItemLoop = activePlaylist.length === 1 && currentItemKey && currentItemKey === currentKey;

			if(singleItemLoop){
				const hosts = [front, back];
				let activeNode = null;
				for(const host of hosts){
					if(!host) continue;
					const candidate = host.querySelector('video, img');
					if(candidate){
						activeNode = candidate;
						break;
					}
				}
				if(activeNode){
					if(activeNode.tagName === 'VIDEO'){
						activeNode.loop = true;
						if(activeNode.paused || (activeNode.readyState||0) < 2){
							ensureVideoPlaying(activeNode, 'single-item-loop');
						}
					}
					if(Date.now() - lastFetchTs > PLAYLIST_REFRESH_MIN_MS){
						fetchPlaylist().catch(err => console.warn('Single-item refresh failed', err));
					}
					if(timer){ clearTimeout(timer); }
					const loopDelay = Math.max(PLAYLIST_REFRESH_MIN_MS, Math.min(dur * 1000, PLAYLIST_REFRESH_INTERVAL_MS));
					timer = setTimeout(tick, loopDelay);
					return;
				}
			}
			await primePreload(item);
		
			// 🚀 PROFESSIONAL PRELOADING: Enterprise-grade background preparation
			console.log('🎬 PROFESSIONAL PRELOADING: Preparing', PRELOAD_AHEAD, 'items for smooth transitions...');
			for(let i=1;i<=PRELOAD_AHEAD;i++){
				const it = activePlaylist[(activeIdx + i) % activePlaylist.length];
				primePreload(it).catch(e => console.log('🚨 Professional preload optimizing for item', i, ':', e));
			}
			
			// 🎯 ENTERPRISE PRIORITY: Critical next item for zero-lag switching
			if(next && next !== item) {
				console.log('🚀 PRIORITY PROFESSIONAL preloading for instant switching...');
				primePreload(next).catch(e => console.log('🎬 Professional priority optimization:', e));
			}
			
			const durMs = Math.max(1, Math.round(dur * 1000));
			const beginPlayback = async () => {
				try{
					await showItem(item);
				}catch(err){
					console.error('❌ Failed to show item:', err);
				}
				currentItemKey = keyFrom(item);
				if(Date.now() - lastFetchTs > PLAYLIST_REFRESH_MIN_MS){
					fetchPlaylist().catch(fetchErr => console.warn('Playlist refresh failed', fetchErr));
				}
				if(timer){ clearTimeout(timer); }
				timer = setTimeout(tick, durMs);
			};
		
			let syncDelayInfo = { startDelay: 0, intervalMs: 0, clockSkew: 0, halfRtt: 0 };
			if(item && item.sync_ref){
				syncDelayInfo = await computeSyncDelayMs(item);
			}
			const syncDelay = Number.isFinite(syncDelayInfo.startDelay) ? syncDelayInfo.startDelay : 0;
			if(syncDelay > 0){
				if(timer){ clearTimeout(timer); }
				timer = setTimeout(() => {
					beginPlayback().catch(err => console.error('❌ Playback start error:', err));
				}, syncDelay);
				return;
			}
			await beginPlayback();
			return;
		}

		async function sendClientEvent(event, item, error){
			try{
				const body = { store_id: String(storeId), screen_id: String(screenId), event: String(event||'') };
				const fname = fileNameFrom(item); if(fname) body.file = fname;
				if(item && item.id) body.item_id = item.id;
				if(error) body.error = String(error).slice(0,200);
				const qs = new URLSearchParams(); if(pairCode) qs.set('user_code', pairCode);
				await fetch(`${ORIGIN}/api/client_event?`+qs.toString(), { method:'POST', headers: { 'Content-Type':'application/json', ...(pairCode?{'X-User-Code':pairCode}:{}) }, body: JSON.stringify(body) });
			}catch{}
		}

		window.addEventListener('resize', ()=>{ try{ applyOrientation(); }catch{} });
		(async function init(){
			if(!storeId || !screenId){ location.href = '/webplayer'; return; }
			
			// Initialize enhanced server time synchronization for perfect cross-screen sync
			console.log('🌐 Initializing enhanced server time synchronization for', screenId);
			await getServerTime();
			
			// Perform additional sync samples for better initial accuracy
			setTimeout(async () => {
				await getServerTime();
				console.log('🌐 Secondary server time sync completed for', screenId);
			}, 2000);
			
			// Set up frequent server time sync to maintain consistency
			setInterval(async () => {
				await getServerTime();
				console.log('🌐 Periodic server time sync refreshed for', screenId);
			}, 15000); // Sync every 15 seconds for better consistency
			
			// Additional high-frequency sync for the first 2 minutes
			let initialSyncCount = 0;
			const initialSyncInterval = setInterval(async () => {
				await getServerTime();
				initialSyncCount++;
				console.log(`🌐 Initial high-freq sync ${initialSyncCount} for`, screenId);
				
				if(initialSyncCount >= 8) { // 8 syncs in 2 minutes
					clearInterval(initialSyncInterval);
					console.log('🌐 Initial high-frequency sync phase completed for', screenId);
				}
			}, 15000); // Every 15 seconds for first 2 minutes
			
			// Prompt user-controlled fullscreen; avoid automatic requests that modern browsers block
			ensureFullscreenOnGesture();
			// Hint for users if fullscreen is blocked
			try{ 
				setTimeout(()=>{ 
					if(!isFullscreen()){ 
						overlay.textContent = `${overlay.textContent} • Press Enter or Click to go Fullscreen`; 
						console.log('Added fullscreen hint to overlay');
					} 
				}, 1000); 
			}catch{}
			// Kick off
			tick();
			if(!playlistRefreshTicker){
				playlistRefreshTicker = setInterval(()=>{
					fetchPlaylist(true).catch(err => console.warn('Periodic playlist refresh failed', err));
				}, PLAYLIST_REFRESH_INTERVAL_MS);
			}
			// Generate or retrieve persistent device ID for Android TV tracking
			function getDeviceId() {
				let deviceId = localStorage.getItem('phtv_device_id');
				if (!deviceId) {
					// Generate unique ID: tv_ + random string + timestamp
					deviceId = 'tv_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
					localStorage.setItem('phtv_device_id', deviceId);
					console.log('🆔 Generated new device ID:', deviceId);
				}
				return deviceId;
			}
			const DEVICE_ID = getDeviceId();
			
			// Keep-alive heartbeat so dashboard sees this webplayer as online
			async function sendHeartbeat(){
				try{
					const qs = new URLSearchParams({ 
						store_id: storeId, 
						screen_id: screenId,
						device_id: DEVICE_ID  // Send persistent device ID
					});
					if(pairCode) qs.set('user_code', pairCode);
					await fetch(`${ORIGIN}/api/screen_heartbeat?`+qs.toString(), { method:'GET', cache:'no-store', headers: pairCode?{'X-User-Code': pairCode}:{} });
				}catch{}
			}
			sendHeartbeat(); setInterval(sendHeartbeat, 30000);
			// Poll for server-side commands (like reload) to apply changes instantly
			setInterval(pollCommands, COMMANDS_POLL_MS);
			// Pause when tab hidden
			document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(timer){ clearTimeout(timer); timer=null; } } else { if(!timer) tick(); } });
		})();

		// Preload video and ensure ready before sync
		async function robustSyncWait(node, item, durationSec, screenId) {
			// Wait for video metadata and readyState
			if (node.readyState < 2) {
				await new Promise((resolve) => {
					node.addEventListener('loadedmetadata', resolve, { once: true });
				});
			}
			// Wait for enough data to play
			if (node.readyState < 3) {
				await new Promise((resolve) => {
					node.addEventListener('canplay', resolve, { once: true });
				});
			}
			// Fallback: if not ready in 2s, proceed anyway
			setTimeout(() => {
				if (node.readyState < 3) {
					console.warn('⚠️ Video not ready after 2s, starting anyway to avoid black screen');
				}
			}, 2000);
			// Now do sync wait
			const syncGroup = item && item.sync_ref && item.sync_ref.group ? item.sync_ref.group : 'default';
			await stableSyncWait(syncGroup, screenId);
			console.log('🚀 SYNC COMPLETE:', screenId, 'starting playback NOW (server time sync)');
		}
	</script>
