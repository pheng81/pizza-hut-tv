<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Player (Legacy)</title>
  <style>
    html, body { height:100%; margin:0; background:#000; color:#fff; overflow:hidden; }
  #stage { position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden; background:#000; transform-origin: 50% 50%; }
    .layer { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:#000; }
    .hidden { display:none; }
    .media { max-width:100%; max-height:100%; }
    .fade { opacity:0; transition: opacity 1s ease; }
    .visible { opacity:1; }
    #overlay { position:absolute; left:10px; bottom:10px; font:12px/1.4 Arial, sans-serif; color:#9aa7ff; opacity:.22; }
    #address-overlay {
      position: absolute;
      right: 20px;
      bottom: 20px;
      max-width: 44vw;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(8, 15, 32, 0.62);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f8fafc;
      font: 500 20px/1.35 Arial, sans-serif;
      box-shadow: 0 12px 34px rgba(0,0,0,0.32);
      text-align: right;
      pointer-events: none;
    }
    #address-overlay[hidden] { display: none; }
    #address-overlay small {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.78);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>
  <div id="overlay"></div>
  <div id="address-overlay" {% if not display_address %}hidden{% endif %}><small>{% if display_address_source == 'store' %}Store Address{% else %}Screen Address{% endif %}</small><span>{{ display_address or '' }}</span></div>
  <script>
    // ES5-only player for older TV browsers
    function isFullscreen(){ try{ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }catch(e){ return false; } }
    function requestFs(el){ try{ var e=el||document.documentElement; var r=e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||e.msRequestFullscreen; if(r){ var p=r.call(e); if(p && p.catch) p.catch(function(){}); } }catch(e){} }
    function ensureFullscreenOnGesture(){
      var fired=false;
      function handler(){ if(fired) return; fired=true; if(!isFullscreen()) requestFs(document.documentElement); cleanup(); }
      function onKey(ev){ ev=ev||window.event; var k=ev.key||ev.keyCode; if(k==='Enter'||k===13||k===32) handler(); }
      function cleanup(){ try{ window.removeEventListener('click', handler); }catch(e){} try{ window.removeEventListener('touchstart', handler); }catch(e){} try{ window.removeEventListener('keydown', onKey); }catch(e){} }
      try{ window.addEventListener('click', handler); }catch(e){}
      try{ window.addEventListener('touchstart', handler); }catch(e){}
      try{ window.addEventListener('keydown', onKey); }catch(e){}
    }
    function getQuery(){ var q={}, s=window.location.search||''; if(s&&s.charAt(0)==='?') s=s.slice(1); var p=s.split('&'); for(var i=0;i<p.length;i++){ var kv=p[i].split('='); var k=decodeURIComponent(kv[0]||''); var v=decodeURIComponent((kv[1]||'').replace(/\+/g,' ')); if(k) q[k]=v; } return q; }
    var params = getQuery();
    var storeId = params.store_id||'';
    var screenId = params.screen_id||'';
    var pairCode = params.code||'';
    var addressOverlay=document.getElementById('address-overlay');
    if(addressOverlay && !addressOverlay.hidden){
      setTimeout(function(){
        try{
          addressOverlay.style.transition='opacity 0.35s ease';
          addressOverlay.style.opacity='0';
          setTimeout(function(){ addressOverlay.hidden = true; }, 350);
        }catch(e){
          addressOverlay.hidden = true;
        }
      }, 3000);
    }
    var DEFAULT_ORIGIN = 'https://api.everydayadvertise.com';
    var ORIGIN = (window.location && window.location.origin) ? (window.location.origin.indexOf('http:')===0 ? window.location.origin.replace(/^http:/,'https:') : window.location.origin) : DEFAULT_ORIGIN;
    try{ if(location.protocol==='http:' && /(^|\.)everydayadvertise\.com$/i.test(location.hostname)){ location.replace('https:' + location.href.slice(5)); } }catch(e){}

    var videoExt = ['mp4','webm','ogg','mov','avi','mkv','m4v'];
    function isVideoByName(name){ if(!name) return false; var ext=(name.split('?')[0].split('#')[0].split('.').pop()||'').toLowerCase(); for(var i=0;i<videoExt.length;i++){ if(videoExt[i]===ext) return true; } return false; }
    function fileNameFrom(item){ try{ var f=item&&item.file||item&&item.url||''; if(typeof item==='string') f=item; if(/^[a-z]+:\/\//i.test(f)){ var a=document.createElement('a'); a.href=f; var p=a.pathname||''; return (p.split('/').pop()||''); } return (f.split('/').pop()||''); }catch(e){ return ''; } }
    function mediaUrl(item){ 
        // For slice-aware videos, prioritize slice_url or preferred_url
        if (typeof item === 'object' && item && item.slice_aware && (item.slice_url || item.preferred_url)) {
            return (item.slice_url || item.preferred_url).replace(/^http:/, 'https:');
        }
        var u=(typeof item==='string')?item:(item.url||item.file||''); 
        if(/^https?:\/\//i.test(u)){ return u.replace(/^http:/,'https:'); } 
        var fname=(u.charAt(0)==='/'?u.slice(1):u); 
        var isVid=isVideoByName(fname); 
        return ORIGIN + '/' + (isVid? 'media' : 'static/uploads') + '/' + fname; 
    }

    var stage=document.getElementById('stage'); var layerA=document.getElementById('layerA'); var layerB=document.getElementById('layerB'); var front=layerA, back=layerB;
    var playlist=[]; var idx=0; var timer=null; var lastFetchTs=0;
  var orientationMode='default'; // 'default'|'vertical'|'horizontal'
  var displayRotation=0; // 0|90|180|270

    var overlay=document.getElementById('overlay'); overlay.textContent='Store '+storeId+' • Screen '+screenId;

    function clearNode(n){ while(n.firstChild) n.removeChild(n.firstChild); }
    function swapLayers(){ var t=front; front=back; back=t; }
    function preloadImage(url,cb){ var img=new Image(); var done=false; var to=setTimeout(function(){ if(done) return; done=true; cb(new Error('image timeout')); },6000); img.onload=function(){ if(done) return; done=true; clearTimeout(to); cb(null,img); }; img.onerror=function(){ if(done) return; done=true; clearTimeout(to); cb(new Error('image error')); }; img.src=url; }
    function preloadVideo(url,cb){ var v=document.createElement('video'); v.autoplay=false; v.muted=true; v.preload='auto'; var done=false; var to=setTimeout(function(){ if(done) return; done=true; cb(new Error('video timeout')); },8000); var onReady=function(){ if(done) return; done=true; clearTimeout(to); cb(null,v); }; var onErr=function(){ if(done) return; done=true; clearTimeout(to); cb(new Error('video error')); }; v.addEventListener('canplay', onReady); v.addEventListener('error', onErr); v.src=url; try{ v.load(); }catch(e){} }
    function applyOrientation(){
      try{
        var base=(orientationMode==='vertical')?90:0;
        var total=((base + (Number(displayRotation)||0))%360+360)%360;
        var vw=window.innerWidth||document.documentElement.clientWidth||1920;
        var vh=window.innerHeight||document.documentElement.clientHeight||1080;
        var scale=1;
        if(total%180===90){ scale=Math.max(0.01, Math.min(5, Math.min(vw/Math.max(vh,1), vh/Math.max(vw,1)))); }
        var parts=['rotate('+total+'deg)'];
        if(scale!==1){ parts.push('scale('+scale.toFixed(5)+')'); }
        stage.style.transform=parts.join(' ');
      }catch(e){}
    }

    function showItem(item){ var url=mediaUrl(item); if(!url) return; var isVid=(item.media_type||'').toLowerCase()==='video' || isVideoByName(url) || isVideoByName(fileNameFrom(item)); var pre = isVid? preloadVideo : preloadImage; pre(url, function(err,node){ if(err){ try{ /* skip on error */ }catch(e){} return; } try{ node.className='media'; if(isVid){ node.loop=true; node.autoplay=true; node.muted=true; try{ node.play(); }catch(e){} } }catch(e){} clearNode(back); back.appendChild(node); back.className='layer visible'; front.className='layer fade'; setTimeout(function(){ front.className='layer hidden'; swapLayers(); }, 1100); }); }

    function nextIndex(){ if(!playlist.length) return 0; return (idx+1) % playlist.length; }
    function fetchPlaylist(){
      var url=ORIGIN + '/playlist/' + encodeURIComponent(storeId) + '/' + encodeURIComponent(screenId);
      if(pairCode){ url += (url.indexOf('?')>=0?'&':'?') + 'user_code=' + encodeURIComponent(pairCode); }
      var xhr=new XMLHttpRequest(); xhr.open('GET', url, true);
      if(pairCode){ try{ xhr.setRequestHeader('X-User-Code', pairCode); }catch(e){} }
      xhr.onreadystatechange=function(){ if(xhr.readyState===4){ try{ var j=JSON.parse(xhr.responseText); if(j && j.success){ if(j.playlist){ playlist=j.playlist; if(idx>=playlist.length) idx=0; } if(j.orientation){ orientationMode=String(j.orientation||'default'); } if(typeof j.rotation==='number'){ displayRotation = (j.rotation||0); } applyOrientation(); } }catch(e){} lastFetchTs=Date.now(); } };
      try{ xhr.send(); }catch(e){}
    }
    function tick(){
      if(!playlist.length){ fetchPlaylist(); timer=setTimeout(tick,1500); return; }
      var item=playlist[idx];
      var dur=Math.max(1, parseInt(item.duration||10,10));
      var next=playlist[nextIndex()];
      if(next){ var u=mediaUrl(next); if(u){ (isVideoByName(u)?preloadVideo:preloadImage)(u,function(){}); } }
      showItem(item);
      idx=nextIndex();
      if(Date.now()-lastFetchTs>20000) fetchPlaylist();
      // Sync alignment by start_epoch when present
      try{
        var sref = item && item.sync_ref || null;
        var se = sref && Number(sref.start_epoch||0);
        if(se && isFinite(se) && dur){
          var now = Date.now();
          var base = se*1000;
          var period = Math.max(1000, dur*1000);
          var n = Math.ceil((now - base)/period);
          var nextAt = base + n*period;
          var delay = Math.max(0, nextAt - now);
          if(delay < 50) delay = 50;
          if(timer){ try{ clearTimeout(timer); }catch(e){} }
          timer = setTimeout(tick, delay);
          return;
        }
      }catch(e){}
      if(timer){ try{ clearTimeout(timer); }catch(e){} }
      timer=setTimeout(tick,dur*1000);
    }

  window.addEventListener ? window.addEventListener('resize', function(){ applyOrientation(); }) : null;
  // Prompt user-controlled fullscreen; avoid automatic requests that modern browsers block
  try{ ensureFullscreenOnGesture(); }catch(e){}
  try{ setTimeout(function(){ if(!isFullscreen()){ var ov=document.getElementById('overlay'); if(ov){ ov.textContent = (ov.textContent||'') + ' • Press Enter or Click to go Fullscreen'; console.log('Added fullscreen hint to overlay'); } } }, 1000); }catch(e){}
  tick();
  </script>
</body>
</html>
