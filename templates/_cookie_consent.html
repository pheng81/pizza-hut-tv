<div id="cookieConsent" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:10000;background:#0d1218;color:#e6edf3;border:1px solid #263244;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
    <div style="min-width:240px;flex:1 1 auto;font-size:14px;line-height:1.4">
      We use cookies only for essential features like login and session security. By using this site, you accept cookies.
    </div>
    <div style="display:flex;gap:8px;flex:0 0 auto">
      <a href="/privacy" style="text-decoration:none;color:#9fb3c8;border:1px solid #324152;border-radius:8px;padding:8px 10px;background:#121a24">Learn more</a>
      <button id="cookieAcceptBtn" style="border:1px solid #2563eb;background:#2563eb;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer">Accept</button>
    </div>
  </div>
</div>
<script>
(function(){
  try{
    var KEY = 'cookieConsent.v1';
    var accepted = localStorage.getItem(KEY);
    var el = document.getElementById('cookieConsent');
    if(!el) return;
    if(!accepted){ el.style.display = 'block'; }
    var btn = document.getElementById('cookieAcceptBtn');
    if(btn){ btn.addEventListener('click', function(){ localStorage.setItem(KEY, '1'); el.style.display='none'; }); }
  }catch(e){}
})();
</script>
<script>
(function(){
  var SAFE_IDS = new Set(['cookieConsent', 'cookieAcceptBtn', 'logoIntro', 'aiChatButton', 'aiChatWindow']);
  var SAFE_CLASS_SNIPPETS = ['ai-chat-', 'message-avatar', 'typing-indicator'];

  function isSafeElement(el){
    if (!el || !(el instanceof HTMLElement)) return true;
    if (SAFE_IDS.has(el.id)) return true;
    var cls = String(el.className || '');
    return SAFE_CLASS_SNIPPETS.some(function(part){ return cls.indexOf(part) !== -1; });
  }

  function isUnexpectedViewportBlocker(el){
    if (!el || !(el instanceof HTMLElement) || isSafeElement(el)) return false;
    var style = window.getComputedStyle(el);
    if (
      style.display === 'none' ||
      style.visibility === 'hidden' ||
      style.pointerEvents === 'none' ||
      style.opacity === '0' ||
      ['static', 'relative'].indexOf(style.position) !== -1
    ) {
      return false;
    }

    var rect = el.getBoundingClientRect();
    if (rect.width < window.innerWidth * 0.96 || rect.height < window.innerHeight * 0.96) {
      return false;
    }

    var zIndex = parseInt(style.zIndex || '0', 10);
    if (Number.isNaN(zIndex) || zIndex < 5) {
      return false;
    }

    return true;
  }

  function neutralizeViewportBlockers(){
    try {
      Array.from(document.querySelectorAll('body *')).forEach(function(el){
        if (!isUnexpectedViewportBlocker(el)) return;
        el.setAttribute('data-overlay-neutralized', '1');
        el.style.setProperty('pointer-events', 'none', 'important');
        el.style.setProperty('visibility', 'hidden', 'important');
        el.style.setProperty('opacity', '0', 'important');
      });
    } catch(e) {}
  }

  function scheduleSweep(){
    neutralizeViewportBlockers();
    window.setTimeout(neutralizeViewportBlockers, 250);
    window.setTimeout(neutralizeViewportBlockers, 1000);
    window.setTimeout(neutralizeViewportBlockers, 3000);
    window.setTimeout(neutralizeViewportBlockers, 6000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleSweep, { once: true });
  } else {
    scheduleSweep();
  }

  window.addEventListener('load', scheduleSweep);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) scheduleSweep(); });

  try {
    var observer = new MutationObserver(function(){ neutralizeViewportBlockers(); });
    document.addEventListener('DOMContentLoaded', function(){
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
      window.setTimeout(function(){ try { observer.disconnect(); } catch(e) {} }, 15000);
    }, { once: true });
  } catch(e) {}
})();
</script>
