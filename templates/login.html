<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
  :root{ --text:#0a0a0a; --muted:#6b7280; --stroke:#e5e7eb; --accent:#f97316; }
  *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Inter, system-ui, Arial, sans-serif; background:#ffffff; color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:28px; width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    h1 { margin:6px 0 14px; font-size:22px; text-align:center; }
    .brand{ display:flex; align-items:center; justify-content:center; gap:10px; }
    .brand img{ height:36px; }
  .brand .name{ display:none; }
    .field { margin:12px 0; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=password]{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid #d1d5db; background:#fff; color:var(--text); }
  .btn { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #d1d5db; background:#1e293b; color:#e6edf3; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .btn:not(.primary):hover { background:#2563eb; border-color:#2563eb; color:#fff; }
  .btn:hover, .btn:focus { text-decoration:none; }
  .primary{ background:linear-gradient(135deg, #ffb36b, #ffd9a5); border:0; color:#111; font-weight:700; }
  .primary:hover{ filter:brightness(.98); }
    .sep { text-align:center; margin:14px 0; color:var(--muted); font-size:12px; display:flex; align-items:center; gap:10px; }
    .sep .line{ flex:1; height:1px; background:#e5e7eb; }
    .flash { color:#b91c1c; font-size:12px; margin-bottom:8px; text-align:center; }
    .footer{ text-align:center; margin-top:12px; font-size:13px; }
    .footer a{ color:#2563eb; text-decoration:none; }
  </style>
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="permissions-policy" content="interest-cohort=()">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <script>
    // Prevent back-forward cache for security
    window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });
  </script>
  <style> .logo { display:block; margin:0 auto 10px; height:40px; filter: saturate(0.9) brightness(1.05); } </style>
</head>
<body>
  <div class="card">
    <div class="brand">
  <img class="logo" src="{{ url_for('static', filename='ea-logo.svg') }}?v={{ (build_stamp or 0) }}" alt="Logo">
  <div class="name"></div>
    </div>
    <h1>Sign in</h1>
    {% with messages = get_flashed_messages(category_filter=['error']) %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="field"><button class="btn primary" type="submit">Sign in</button></div>
    </form>
    
      <div class="sep"><div class="line"></div> or <div class="line"></div></div>
      <form method="get" action="{{ url_for('auth_google') }}" style="margin-bottom:8px">
        <button class="btn" type="submit">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.8 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C33.6 6.1 29.1 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.1 16.2 18.7 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C33.6 6.1 29.1 4 24 4 16.1 4 9.1 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.1C29 35.8 26.7 36 24 36c-5.2 0-9.6-3.1-11.4-7.5l-6.4 5C8.9 40.1 15.9 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-4.5 5.5-8.3 5.5-5.2 0-9.6-3.1-11.4-7.5l-6.4 5C8.9 40.1 15.9 44 24 44c8.9 0 16.4-6.2 19.1-15c.5-1.5.8-3.1.8-4.8 0-1.3-.1-2.5-.3-3.7z"/></svg>
          Continue with Google
        </button>
      </form>
      <form method="get" action="{{ url_for('auth_microsoft') }}">
        <button class="btn" type="submit">
          <svg width="16" height="16" viewBox="0 0 23 23" aria-hidden="true"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>
          Continue with Microsoft
        </button>
      </form>
    <div class="footer"><a href="{{ url_for('signup') }}">Create an account</a></div>
  </div>
</body>
</html>
