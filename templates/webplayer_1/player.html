	<script>
		// 🚀 PROFESSIONAL SYNCHRONIZATION SYSTEM - Enterprise Grade
		class SyncCoordinator {
			constructor(storeId, screenId) {
				this.storeId = storeId;
				this.screenId = screenId;
				this.syncTargets = new Map(); // Other screens in sync group
				this.masterClock = Date.now();
				this.syncTolerance = 50; // 50ms tolerance for perfect sync
				this.transitionQueue = [];
				this.lastSyncTime = 0;
				
				// SYNCHRONIZED SCREEN TIMING: All screens start at aligned intervals
				this.getScreenSyncOffset = () => {
					// Extract screen number for sync calculations
					const screenMatch = screenId.match(/screen(\d+)$/);
					const screenNum = screenMatch ? parseInt(screenMatch[1]) : 1;
					// All screens sync to same timeline - no offset needed for true sync
					return 0; // All screens start simultaneously
				};
				
				console.log('🚀 Professional Sync Coordinator initialized for', screenId, 'with sync offset:', this.getScreenSyncOffset());
			}
			
			// Enterprise-style frame-perfect sync
			scheduleSync(item, targetTime) {
				const now = Date.now();
				const delay = Math.max(0, targetTime - now);
				
				console.log('⏱️ Scheduling sync transition in', delay, 'ms for perfect alignment');
				
				return new Promise(resolve => {
					setTimeout(() => {
						this.executeSyncTransition(item);
						resolve();
					}, delay);
				});
			}
			
			// Professional black-screen elimination
			executeSyncTransition(item) {
				console.log('🎬 Executing PROFESSIONAL sync transition - NO BLACK SCREENS');
				
				// Add transitioning class for anti-black-screen effect
				front.classList.add('transitioning');
				back.classList.add('transitioning');
				
				// Immediate transition with professional timing
				setTimeout(() => {
					front.classList.remove('transitioning');
					back.classList.remove('transitioning');
				}, 100); // Brief anti-black-screen protection
			}
			
			// Calculate perfect sync timing like industry systems
			calculateSyncMoment(duration) {
				// GLOBAL SYNC FIX: All screens sync to server timestamp instead of local time
				// This ensures perfect synchronization across all screens
				const serverTime = window.serverTimestamp || Date.now();
				const syncInterval = 2000; // 2 second sync intervals for all screens
				const nextSync = Math.ceil(serverTime / syncInterval) * syncInterval;
				
				console.log('🎯 GLOBAL SYNC: All screens syncing to timestamp', nextSync);
				return nextSync;
			}
			
			// Get server timestamp for global sync
			async getServerTime() {
				try {
					const response = await fetch('/api/sync-time');
					const data = await response.json();
					window.serverTimestamp = data.timestamp;
					return data.timestamp;
				} catch (error) {
					console.warn('Server time sync failed, using local time');
					return Date.now();
				}
			}
		}
		
		// Expose globally so later scripts can instantiate after params resolved
		window.SyncCoordinator = SyncCoordinator;
	</script>

	<script>
		function isTizenTV(){ try{ return /Tizen|TizenBrowser|SamsungBrowser|SMART-TV|SmartTV|Maple/i.test(navigator.userAgent||''); }catch(e){ return false; } }
		function isLowEndTV(){
			try{
				var ua = (navigator.userAgent||'');
				// Heuristics for older TV stacks (Vewd/Opera TV, HbbTV, legacy WebKit, generic AOSP)
				return /HbbTV|Maple|InettvBrowser|Vewd|Opera TV|AOSP TV|Amlogic|MStar|Hisilicon|ChangHong|Coocaa|MiTV|HiBrowser/i.test(ua);
			}catch(e){ return false; }
		}
		function isVewdTV(){
			try{ return /Vewd|Opera TV|OIPF|HbbTV/i.test(navigator.userAgent||''); }catch(e){ return false; }
		}
		function supportsTransform(){
			try{
				var s = document.body && document.body.style ? document.body.style : null;
				if(!s) return false;
				return ('transform' in s) || ('webkitTransform' in s) || ('mozTransform' in s) || ('oTransform' in s) || ('msTransform' in s);
			}catch(e){ return true; }
		}
		function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement); }
		function requestFs(el){ try{ var e=el||document.documentElement; var r=e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||e.msRequestFullscreen; if(r){ var p=r.call(e); if(p && p.catch) p.catch(function(){}); } }catch(e){} }
		function ensureFullscreenOnGesture(){
			var fired=false;
			function handler(){ if(fired) return; fired=true; if(!isFullscreen()) requestFs(document.documentElement); cleanup(); }
			function onKey(ev){ ev=ev||window.event; var k=ev.key||ev.keyCode; if(k==='Enter' || k===13 || k===32) handler(); }
			function cleanup(){ window.removeEventListener('click', handler); window.removeEventListener('touchstart', handler); window.removeEventListener('keydown', onKey); }
			window.addEventListener('click', handler, { once:true });
			window.addEventListener('touchstart', handler, { once:true });
			window.addEventListener('keydown', onKey);
		}
		const params = new URLSearchParams(location.search);
		const storeId = params.get('store_id') || '';
		const screenId = params.get('screen_id') || '';
		const pairCode = params.get('code') || '';
		const syncCoordinator = new window.SyncCoordinator(storeId, screenId);
		const debugMode = params.get('debug') === '1' || params.get('debug') === 'true';
		
		// 🚀 AGGRESSIVE SERVER TIME SYNC: Initialize immediately and re-sync every 5 seconds
		(async function initializeServerTimeSync() {
			try {
				// Initial sync with multiple samples for accuracy
				await getServerTime();
				console.log('✅ Initial server time synchronized');
				
				// 🚀 CONTINUOUS RE-SYNC: Re-sync every 5 seconds for perfect clock alignment
				setInterval(async () => {
					try {
						await getServerTime();
						console.log('🔄 Server time re-synchronized, offset:', serverTimeOffset.toFixed(3) + 'ms');
					} catch(err) {
						console.warn('⚠️ Background server time sync failed:', err);
					}
				}, 5000); // Every 5 seconds (optimized for bandwidth)
				
			} catch(err) {
				console.warn('⚠️ Initial server time sync failed:', err);
			}
		})();
		
		// Extract screen number from screenId (e.g., "screen1" -> 1)
		function getScreenNumber(screenId) {
			if(!screenId) return 0;
			const match = screenId.match(/screen(\d+)/);
			return match ? parseInt(match[1]) : 0;
		}
		const screenNumber = getScreenNumber(screenId);
		console.log('Webplayer initialized for:', { storeId, screenId, screenNumber });
		
		const DEFAULT_ORIGIN = 'https://api.everydayadvertise.com';
		const ORIGIN = (window.location && window.location.origin)
			? (window.location.origin.startsWith('http:') && 
			   !window.location.hostname.includes('127.0.0.1') && 
			   !window.location.hostname.includes('localhost')
				? window.location.origin.replace(/^http:/, 'https:')
				: window.location.origin)
			: DEFAULT_ORIGIN;
		try{ if (location.protocol === 'http:' && /(^|\.)everydayadvertise\.com$/i.test(location.hostname)) { location.replace('https:' + location.href.slice(5)); } }catch{}

		const videoExt = ['mp4','webm','ogg','mov','avi','mkv','m4v'];
		function extFromName(name){ if(!name) return ''; const n=String(name); const base=n.split('?')[0].split('#')[0]; return (base.split('.').pop()||'').toLowerCase(); }
		function isVideoByName(name){ if(!name) return false; return videoExt.includes(extFromName(name)); }
		function fileNameFrom(item){
			if(!item) return '';
			if(typeof item === 'string'){
				try{ const u = new URL(item); return (u.pathname.split('/').pop()||''); }catch{ return (item.split('/').pop()||''); }
			}
			const f = item.file || '';
			if(f) return String(f).split('/').pop()||'';
			const u = item.url || '';
			try{ const p = new URL(u).pathname; return (p.split('/').pop()||''); }catch{ return (String(u).split('/').pop()||''); }
		}
		function relKeyFrom(item){
			try{
				if(!item) return '';
				if(typeof item === 'string'){
					if(/^https?:\/\//i.test(item)){ const u=new URL(item); return u.pathname.replace(/^\//,''); }
					return item.startsWith('/')?item.slice(1):item;
				}
				if(item.file){ const s=String(item.file); return s.startsWith('/')?s.slice(1):s; }
				if(item.url){ const u=new URL(String(item.url)); return u.pathname.replace(/^\//,''); }
				return '';
			}catch{ return ''; }
		}
		function determineSliceOrder(item){
			try {
				if(item && item.sync_ref && item.sync_ref.order !== undefined && item.sync_ref.order !== null){
					const parsed = parseInt(item.sync_ref.order, 10);
					if(!Number.isNaN(parsed) && parsed >= 0){
						return parsed;
					}
				}
				if(screenNumber > 0){
					const fallback = screenNumber - 1;
					if(fallback >= 0){
						return fallback;
					}
				}
			}catch{}
			return null;
		}

		const SYNC_ALIGNMENT_WINDOW_MS = 10; // 🚀 ULTRA-TIGHT: 10ms window (was 20ms)
		const SYNC_PRECISION_TOLERANCE = 5; // 🚀 5ms precision tolerance for FRAME-PERFECT sync (was 10ms)
		
		// 🚀 HYPER-OPTIMIZED server time synchronization variables
		let serverTimeOffset = 0; // Offset between server and client time
		let lastServerSync = 0;
		let syncSamples = []; // Store multiple samples for better accuracy
		let networkLatency = 0; // Estimated network latency
		let syncInProgress = false; // Prevent multiple simultaneous syncs
		
		// 🚀 HYPER-AGGRESSIVE SERVER TIME SYNC - Re-sync every 2 seconds for PERFECT sync
		async function getServerTime() {
			if(syncInProgress) return Date.now() + serverTimeOffset; // Don't overlap syncs
			syncInProgress = true;
			
			const maxRetries = 3; // Faster retries for responsiveness
			const samples = [];
			
			for(let attempt = 0; attempt < maxRetries; attempt++) {
				try {
					const startTime = performance.now();
					const response = await fetch('/api/server_time', { 
						cache: 'no-cache',
						headers: { 
							'Cache-Control': 'no-cache',
							'Pragma': 'no-cache'
						},
						priority: 'high' // 🚀 HIGH PRIORITY fetch for faster response
					});
					const requestLatency = performance.now() - startTime;
					
					if(!response.ok) {
						throw new Error(`HTTP ${response.status}`);
					}
					
					const data = await response.json();
					const clientTime = Date.now();
					const serverTime = data.server_time_ms;
					
					// 🚀 ADVANCED: Compensate for network latency (half of round-trip time)
					const adjustedServerTime = serverTime + (requestLatency / 2);
					const offset = adjustedServerTime - clientTime;
					
					samples.push({
						offset: offset,
						latency: requestLatency,
						timestamp: clientTime
					});
					
					// 🚀 FAST EXIT: If latency is very low (<30ms), use this sample immediately
					if(requestLatency < 30 && samples.length >= 2) {
						console.log(`🌐 FAST SERVER SYNC (low latency):`, {
							latency: requestLatency.toFixed(1) + 'ms',
							offset: offset.toFixed(3) + 'ms',
							screenId: screenId
						});
						break;
					}
					
				} catch(err) {
					console.warn(`Server time sync attempt ${attempt + 1} failed:`, err);
					if(attempt === maxRetries - 1) {
						console.warn('All server time sync attempts failed, using client time');
						syncInProgress = false;
						return Date.now();
					}
					// 🚀 FASTER RETRY: Wait only 50ms before retry (was 100ms)
					await new Promise(resolve => setTimeout(resolve, 50));
				}
			}
			
			if(samples.length > 0) {
				// 🚀 SMART FILTERING: Remove outliers (samples with very high latency)
				const avgLatency = samples.reduce((sum, s) => sum + s.latency, 0) / samples.length;
				const filteredSamples = samples.filter(s => s.latency < avgLatency * 1.5);
				
				// Calculate median offset from filtered samples for better accuracy
				const offsets = (filteredSamples.length > 0 ? filteredSamples : samples)
					.map(s => s.offset)
					.sort((a, b) => a - b);
				const medianOffset = offsets[Math.floor(offsets.length / 2)];
				
				// Calculate average latency from best samples
				const bestSamples = (filteredSamples.length > 0 ? filteredSamples : samples);
				const bestLatency = bestSamples.reduce((sum, s) => sum + s.latency, 0) / bestSamples.length;
				
				serverTimeOffset = medianOffset;
				networkLatency = bestLatency;
				lastServerSync = Date.now();
				
				// Store samples for drift analysis
				syncSamples.push({
					offset: medianOffset,
					latency: bestLatency,
					timestamp: lastServerSync
				});
				
				// Keep only last 20 samples (was 10) for better drift detection
				if(syncSamples.length > 20) {
					syncSamples = syncSamples.slice(-20);
				}
				
				console.log('🌐 ⚡ HYPER-FAST SERVER SYNC:', {
					medianOffset: medianOffset.toFixed(3) + 'ms',
					avgLatency: bestLatency.toFixed(1) + 'ms',
					samples: samples.length,
					filtered: filteredSamples.length,
					screenId: screenId
				});
				
				syncInProgress = false;
				return Date.now() + medianOffset;
			}
			
			syncInProgress = false;
			return Date.now(); // Fallback
		}
		
		function getServerSyncedTime() {
			const clientTime = Date.now();
			
			// 🚀 HYPER-AGGRESSIVE RE-SYNC: Re-sync every 2 seconds (was 5) for ULTRA-TIGHT coordination
			if(clientTime - lastServerSync > 2000) { // Re-sync every 2 seconds
				getServerTime(); // Async refresh for next time
			}
			
			// Apply advanced drift compensation with multiple samples
			let adjustedOffset = serverTimeOffset;
			if(syncSamples.length >= 5) { // Need more samples (was 3)
				// Calculate drift trend from recent samples
				const recent = syncSamples.slice(-10); // Use last 10 samples (was 5)
				const oldestTime = recent[0].timestamp;
				const newestTime = recent[recent.length - 1].timestamp;
				const oldestOffset = recent[0].offset;
				const newestOffset = recent[recent.length - 1].offset;
				
				if(newestTime > oldestTime) {
					const driftRate = (newestOffset - oldestOffset) / (newestTime - oldestTime);
					const timeSinceLastSync = clientTime - lastServerSync;
					adjustedOffset = serverTimeOffset + (driftRate * timeSinceLastSync);
					
					// Log drift compensation more often for monitoring
					if(Math.abs(driftRate) > 0.0005 && Math.random() < 0.05) { // Log 5% of the time
						console.log('🔄 ⚡ Advanced drift compensation:', {
							drift: (driftRate * 1000).toFixed(6) + 'ms/s',
							adjustment: (driftRate * timeSinceLastSync).toFixed(3) + 'ms',
							screenId: screenId
						});
					}
				}
			}
			
			return clientTime + adjustedOffset;
		}
		
		async function computeSyncDelayMs(item, durationSec){
			try{
				if(!item || !item.sync_ref) {
					console.log('🔄 No sync reference - immediate playback');
					return 0;
				}
				const startEpochSec = Number(item.sync_ref.start_epoch || item.sync_ref.startEpoch);
				if(!Number.isFinite(startEpochSec) || startEpochSec <= 0) {
					console.log('🔄 Invalid start epoch - immediate playback');
					return 0;
				}
				const durMs = Math.max(500, Math.round(Number(durationSec||0) * 1000));
				if(!Number.isFinite(durMs) || durMs <= 0) {
					console.log('🔄 Invalid duration - immediate playback');
					return 0;
				}
				
				// Use server-synchronized time for perfect cross-screen sync
				const baseMs = startEpochSec * 1000;
				const now = getServerSyncedTime();
				
				console.log('🔄 SERVER-SYNCED calculation:', {
					startEpoch: startEpochSec,
					durationMs: durMs,
					serverTime: now.toFixed(3),
					baseMs: baseMs,
					screenId: screenId,
					offset: serverTimeOffset.toFixed(3) + 'ms'
				});
				
				if(now + SYNC_PRECISION_TOLERANCE < baseMs){
					const waitTime = Math.min(baseMs - now, durMs);
					console.log('🔄 Waiting for future start:', waitTime.toFixed(3), 'ms');
					return waitTime;
				}
				
				const elapsed = now - baseMs;
				const phase = ((elapsed % durMs) + durMs) % durMs;
				console.log('🔄 Current phase in video:', phase.toFixed(3), 'ms of', durMs, 'ms total');
				
				// Ultra-tight sync window
				if(phase <= SYNC_PRECISION_TOLERANCE) {
					console.log('🔄 Perfect server sync - immediate playback');
					return 0;
				}
				
				const deltaToNext = durMs - phase;
				if(deltaToNext <= SYNC_ALIGNMENT_WINDOW_MS){
					console.log('🔄 Server precision wait for next cycle:', deltaToNext.toFixed(3), 'ms');
					return deltaToNext;
				}
				
				console.log('🔄 Phase too far - immediate playback at offset:', phase.toFixed(3), 'ms');
			}catch(err){
				console.warn('computeSyncDelayMs error', err);
			}
			return 0;
		}

		async function alignToSyncWindow(item, durationSec){
			const waitMs = await computeSyncDelayMs(item, durationSec);
			if(waitMs > SYNC_PRECISION_TOLERANCE){
				console.log('⏳ PRECISION SYNC WAIT:', waitMs.toFixed(3), 'ms for ultra-tight alignment on', screenId);
				
				// Use high-precision timing with requestAnimationFrame for sub-millisecond accuracy
				const startWait = performance.now();
				
				if(waitMs > 16) {
					// For longer waits, use setTimeout + RAF for final precision
					await new Promise(resolve => setTimeout(resolve, waitMs - 16));
					
					// Final precision alignment using requestAnimationFrame
					await new Promise(resolve => {
						const finalStart = performance.now();
						const targetEnd = finalStart + 16;
						
						function precisionWait() {
							if(performance.now() >= targetEnd) {
								resolve();
							} else {

		function startSyncMonitoring(videoElement, item) {

			let lastCorrectionTime = 0;
			const SYNC_CHECK_INTERVAL = 16; // 🚀 CHECK EVERY 16ms (~60Hz) for FRAME-ACCURATE sync (was 33ms)
			const HARD_SYNC_THRESHOLD = 0.08; // 🚀 80ms max tolerance (was 150ms) - hard reset if drift exceeds
			const PLAYBACK_ADJUST_THRESHOLD = 0.015; // 🚀 15ms threshold for playback rate adjustment (was 25ms)
			const CORRECTION_COOLDOWN = 200; // 🚀 200ms cooldown between corrections (was 500ms)
			const MICRO_ADJUST_THRESHOLD = 0.005; // 🚀 NEW: 5ms micro-adjustment threshold for near-perfect sync
			
			const checkSync = () => {
				try {
					if(!document.body.contains(videoElement) || videoElement.paused || videoElement.ended) {
						console.log('🔄 Stopping enhanced sync monitoring - video stopped or removed');
						clearInterval(syncCheckInterval);
						return;
					}
					
					const expectedTime = calculateSyncedVideoTime(item);
					if(expectedTime === null) return;
					
					const actualTime = videoElement.currentTime;
					const drift = Math.abs(actualTime - expectedTime);
					const isBehind = actualTime < expectedTime;
					const now = Date.now();
					const timeSinceLastCorrection = now - lastCorrectionTime;
					
					// 🚀 TIER 1: HARD SYNC for large drift (>80ms)
					if(drift > HARD_SYNC_THRESHOLD) {
						console.log('🔄 ⚡ HARD SYNC (>80ms):', {
							screen: screenId,
							expected: expectedTime.toFixed(3),
							actual: actualTime.toFixed(3),
							drift: drift.toFixed(3) + 's'
						});
						
						// Immediate correction + reset playback rate
						videoElement.currentTime = expectedTime;
						lastCorrectionTime = now;
						videoElement.playbackRate = 1.0;
						
					// 🚀 TIER 2: PLAYBACK RATE ADJUSTMENT for medium drift (15-80ms)
					} else if(drift > PLAYBACK_ADJUST_THRESHOLD && timeSinceLastCorrection > CORRECTION_COOLDOWN) {
						// Use aggressive playback rate for faster sync
						const adjustment = isBehind ? 1.15 : 0.85; // 15% faster/slower (was 12%)
						videoElement.playbackRate = adjustment;
						lastCorrectionTime = now;
						console.log('⚡ Playback adjustment (15-80ms):', {
							screen: screenId,
							rate: adjustment,
							drift: (drift * 1000).toFixed(1) + 'ms',
							direction: isBehind ? 'catching up' : 'slowing'
						});
						
						// Reset after shorter duration for faster convergence
						setTimeout(() => {
							if(videoElement && document.body.contains(videoElement)) {
								videoElement.playbackRate = 1.0;
							}
						}, 400); // 400ms (was 600ms)
						
					// 🚀 TIER 3: MICRO-ADJUSTMENT for small drift (5-15ms)
					} else if(drift > MICRO_ADJUST_THRESHOLD && drift <= PLAYBACK_ADJUST_THRESHOLD && timeSinceLastCorrection > 100) {
						// Very subtle adjustment for fine-tuning
						const microAdjustment = isBehind ? 1.05 : 0.95; // 5% adjustment
						videoElement.playbackRate = microAdjustment;
						lastCorrectionTime = now;
						
						// Reset after brief period
						setTimeout(() => {
							if(videoElement && document.body.contains(videoElement)) {
								videoElement.playbackRate = 1.0;
							}
						}, 200);
						
					// 🚀 TIER 4: PERFECT SYNC (<5ms)
					} else {
						// Ensure normal playback rate
						if(videoElement.playbackRate !== 1.0) {
							videoElement.playbackRate = 1.0;
						}
						// Log occasionally to confirm perfect sync
						if(Math.random() < 0.01) { // 1% of checks
							console.log('✅ ⚡ FRAME-PERFECT SYNC:', {
								screen: screenId,
								drift: (drift * 1000).toFixed(1) + 'ms',
								rate: videoElement.playbackRate
							});
						}
					}
				} catch(err) {
					console.warn('Enhanced sync monitoring error:', err);
				}
			};
			
			// Start monitoring immediately
			setTimeout(() => {
				syncCheckInterval = setInterval(checkSync, SYNC_CHECK_INTERVAL);

					return;
				}

						label: contextLabel || 'unknown',
						readyState: video.readyState,
						currentTime: video.currentTime
					});
					return;

				attempts += 1;

					label: contextLabel || 'unknown',
					readyState: video.readyState,
					networkState: video.networkState,
					paused: video.paused,
					attempt: attempts
				});
				try {
					const playPromise = video.play();
					if(playPromise && playPromise.catch){
						playPromise.catch(err => console.warn('Retry play rejected', err));
					}
				}catch(err){
					console.warn('Retry play threw error', err);
				}
				if(attempts < maxAttempts){
					setTimeout(attemptPlayback, attemptDelay);
				}else{
					console.error('❌ Video failed to enter playing state after retries', {
						label: contextLabel || 'unknown',
						readyState: video.readyState,
						networkState: video.networkState
					});
				}
			}
			attemptPlayback();
		}

		function mediaUrl(item){

		// For slice-aware videos, prioritize slice_url or preferred_url
		if (typeof item === 'object' && item.slice_aware && (item.slice_url || item.preferred_url)) {
			let sliceUrl = item.slice_url || item.preferred_url;
			sliceUrl = normalizeSliceUrl(sliceUrl, item);

			if(!sliceUrl.includes('127.0.0.1') && !sliceUrl.includes('localhost')){

			return sliceUrl;
		}			// First check if item has a slice_url (provided by server for webplayer slice support)

				sliceUrl = normalizeSliceUrl(sliceUrl, item);

				if(!sliceUrl.includes('127.0.0.1') && !sliceUrl.includes('localhost')){
					return sliceUrl.replace(/^http:/,'https:');
				}
				return sliceUrl;
			}
			
			// Fallback: Generate slice URL client-side if sync_ref is present
			const syncRef = (typeof item === 'object' && item.sync_ref) ? item.sync_ref : null;
			if(syncRef && syncRef.mode && syncRef.count > 1) {
				const baseUrl = (typeof item === 'string') ? item : (item.url || item.file || '');
				if(baseUrl && isVideoByName(baseUrl)) {
					// Extract filename for slice URL construction
					let filename = baseUrl;
					if(filename.includes('/')) {
						filename = filename.split('/').pop();
					}
					
				// Construct slice URL using current screen context
				// Use syncRef.order if available, otherwise screenNumber - 1 (0-indexed)
				const sliceOrder = (syncRef.order !== undefined && syncRef.order !== null) 
					? syncRef.order 
					: Math.max(0, screenNumber - 1);
				const sliceParams = new URLSearchParams({
					slice_mode: syncRef.mode || 'split-h',
					slice_count: syncRef.count || 3,
					slice_order: sliceOrder
				});					const sliceUrl = `${ORIGIN}/slice-video/users/toengpheng_at_gmail.com/2025-09/${filename}?${sliceParams}`;
					console.log('Generated client-side slice URL:', sliceUrl);
					return sliceUrl;
				}
			}
			
			const u = (typeof item === 'string') ? item : (item.url || item.file || '');
			if(/^https?:\/\//i.test(u)){
				// Keep absolute URL (CDN) for both images and videos; upgrade to HTTPS if needed for non-localhost
				if(!u.includes('127.0.0.1') && !u.includes('localhost')){
					return u.replace(/^http:/,'https:');
				}
				return u;
			}
			const fname = (u.startsWith('/') ? u.slice(1) : u);
			const isVid = isVideoByName(fname);

		let orientationMode = 'default'; // 'vertical' | 'horizontal' | 'default'

		function applyOrientation(){
			try{
				// Base rotation from orientation
				let rot = (orientationMode === 'vertical') ? 90 : 0;
				let total = ((rot + (Number(displayRotation)||0)) % 360 + 360) % 360;
				
				// Get viewport dimensions
				const vw = window.innerWidth || document.documentElement.clientWidth || 1920;
				const vh = window.innerHeight || document.documentElement.clientHeight || 1080;
				
				// Calculate scale to FILL screen (like Pi client - no letterboxing)
				let scale = 1;
				if (total % 180 === 90) {
					// Portrait orientation on landscape screen (or vice versa)
					// Scale to ensure content fills the screen completely
					scale = Math.max(vw/vh, vh/vw);
				}
				
				// Apply transforms
				const parts = [`rotate(${total}deg)`];
				if (scale !== 1) { 
					parts.push(`scale(${scale.toFixed(5)})`); 
				}
				stage.style.transform = parts.join(' ');
				stage.style.transformOrigin = 'center center';
				
				console.log(`📐 Orientation applied: mode=${orientationMode}, rotation=${displayRotation}°, total=${total}°, scale=${scale.toFixed(3)}`);

				console.error('❌ Orientation error:', e);
			}
		}

				if(j && j.success && Array.isArray(j.playlist)){
					const newSignature = computePlaylistSignature(j.playlist, j.orientation, j.rotation);
					const signatureChanged = Boolean(playlistSignature) && newSignature !== playlistSignature;
					playlist = j.playlist;
					playlistSignature = newSignature;
					if(typeof j.orientation === 'string'){ orientationMode = j.orientation; }
					if(typeof j.rotation === 'number'){ displayRotation = (j.rotation||0); }
					applyOrientation();
					if(idx >= playlist.length) idx = 0;
					// If the currently showing item is no longer present (e.g., schedule switch), advance immediately
					if(currentItemKey){
						const stillPresent = playlist.some(it => keyFrom(it) === currentItemKey);
						if(!stillPresent && playlist.length){

							if(timer){ clearTimeout(timer); timer = null; }

						function clearMsg(){ overlay.textContent = overlay.textContent.replace(/\s•\sPress OK\/Enter to start$/,''); }
						function handler(){
							window.removeEventListener('keydown', onKey);
							window.removeEventListener('click', handler);
							window.removeEventListener('touchstart', handler);

						function onKey(ev){ var k=ev && (ev.key||ev.keyCode); if(k==='Enter'||k===13||k===32){ handler(); } }
						showMsg();
						window.addEventListener('keydown', onKey);

					});
				}
			}catch(e){}

					return '';

		function computeSegmentStyles(node, item, options={}){
			try{
				const sref = item && item.sync_ref || {};
				const mode = (sref.mode||'').toLowerCase();

					screenNumber: screenNumber,
					syncRef_order: sref.order,
					calculated_order: order,
					order_source: orderSource,
					count: count
				});
				const hasSliceUrl = !!(item && item.slice_url);
				const videoElement = (node && node.tagName === 'VIDEO') ? node : null;
				const shouldSegment = count > 1 && (mode === 'split-h' || mode === 'split-v');

					screenNumber: screenNumber,
					hasSliceUrl: hasSliceUrl,
					syncRef: sref,
					mode: mode,
					count: count,
					order: order,
					shouldSegment: shouldSegment,
					itemKeys: item ? Object.keys(item) : 'no item'
				});
				
				node.__segmentItem = item;
				if(options.host){ node.__segmentHost = options.host; }
				if(videoElement && !options.skipMetadataHook && !videoElement.__segmentMetadataHandler){
					const metaHandler = () => {
						try{
							videoElement.dataset.videoWidth = String(videoElement.videoWidth || 0);
							videoElement.dataset.videoHeight = String(videoElement.videoHeight || 0);
							console.log('📐 Segment metadata captured:', {
								width: videoElement.videoWidth,
								height: videoElement.videoHeight,
								ratio: (videoElement.videoWidth && videoElement.videoHeight)

							attachSegmentNode(node);
						}catch(err){ console.warn('Segment metadata handler error', err); }
					};

				}
				let needClientCrop = false;
				if(shouldSegment){

						const rawWidth = videoElement.videoWidth || parseInt(videoElement.dataset.videoWidth || '0', 10) || 0;
						const rawHeight = videoElement.videoHeight || parseInt(videoElement.dataset.videoHeight || '0', 10) || 0;
						if(rawWidth && rawHeight){
							const aspect = rawWidth / Math.max(1, rawHeight);

							if(mode === 'split-h' && aspect >= 2.2){
								needClientCrop = true;

							}
							if(mode === 'split-v' && inverseAspect >= 2.2){
								needClientCrop = true;
								console.log('⚙️ Client-side segment enforcement (tall aspect)', { aspect: inverseAspect, rawWidth, rawHeight });
							}
						}else if(!options.triggeredByMeta){

						}
					}
				}
				if(!needClientCrop){
					if(node.__segmentWrapper && node.__segmentWrapper.parentNode){
						node.__segmentWrapper.parentNode.replaceChild(node, node.__segmentWrapper);
					}

					node.__segmentInner = null;
					node.className = node.className.replace(/\bsegment\b/g, '');

					node.style.mozTransform = '';
					node.style.oTransform = '';
					node.style.transform = '';
					node.style.webkitTransformOrigin = '';
					node.style.mozTransformOrigin = '';
					node.style.oTransformOrigin = '';
					node.style.transformOrigin = '';
					node.style.position = '';
					node.style.top = '';
					node.style.left = '';
					node.style.width = '';
					node.style.height = '';
					node.__segmentRoot = node;
					return node;
				}
				let wrap = node.__segmentWrapper;
				let inner = node.__segmentInner;
				if(!wrap){
					wrap = document.createElement('div');
					wrap.className = 'segment-wrap';
					inner = document.createElement('div');
					inner.className = 'segment-inner';
					wrap.appendChild(inner);
					inner.appendChild(node);
					node.__segmentWrapper = wrap;
					node.__segmentInner = inner;
				}else{
					inner = node.__segmentInner;
					if(inner && node.parentNode !== inner){
						inner.innerHTML = '';
						inner.appendChild(node);
					}
				}
				node.className = node.className.replace(/\bsegment\b/g, '') + ' segment';
				node.style.position = 'absolute';
				node.style.top = '0px';
				node.style.left = '0px';
				node.style.width = '100vw';

					inner.style.position = 'absolute';
					inner.style.top = '0px';
					inner.style.left = (-(order * screenWidth)) + 'px';
					inner.style.width = (screenWidth * count) + 'px';
					inner.style.height = screenHeight + 'px';
					node.style.width = (screenWidth * count) + 'px';
					node.style.height = screenHeight + 'px';

					if(mode === 'split-h'){

						inner.style.webkitTransform = transformValue;
						inner.style.mozTransform = transformValue;
						inner.style.oTransform = transformValue;
						inner.style.transform = transformValue;
						console.log('🎬 SLICE TRANSFORM APPLIED:', {
							screen: screenNumber,
							order: order,
							count: count,
							transform: transformValue,
							mode: mode
						});
					}else{
						const transformValue = 'scaleY(' + count + ') translateY(' + (-(order * 100 / Math.max(1, count))) + '%)';
						inner.style.webkitTransform = transformValue;
						inner.style.mozTransform = transformValue;
						inner.style.oTransform = transformValue;
						inner.style.transform = transformValue;
						console.log('Applied vertical segment transform (inner):', transformValue);
					}
				}
				node.__segmentRoot = wrap;
				return wrap;
			}catch(e){
				if(typeof console !== 'undefined' && console.error) {
					console.error('computeSegmentStyles error:', e);
				}
			}
			return node;
		}

							console.log('⏳ Video not ready yet, setting up listeners...');
							node.addEventListener('loadeddata', () => {
								console.log('✅ Video loadeddata event - revealing now');
								safeReveal();
							}, { once:true });
							node.addEventListener('canplay', () => {
								console.log('✅ Video canplay event - revealing now');
								safeReveal();
							}, { once:true });
							node.addEventListener('canplaythrough', () => {
								console.log('✅ Video canplaythrough event - revealing now');
								safeReveal();
							}, { once:true });
							// Longer timeout to ensure video loads properly
							setTimeout(() => {
								console.log('⏰ Video reveal timeout - forcing reveal');
								safeReveal();
							}, 1200); // Force reveal quickly to avoid prolonged blank states
						}
					}catch(e){ 
						console.error('❌ Video reveal error:', e);
						setTimeout(safeReveal, 500); 
					}
				}else{
					reveal();
				}
				currentItemKey = keyFrom(item);
				try{ sendClientEvent('load_ok', item, null).catch(()=>{}); }catch{}
			}catch(e){
				console.error('Primary video load failed:', url, e);
				
				// Enhanced fallback for slice videos
				try{
					let fallbackUrl = null;
					
					// If slice video failed, try different approaches
					if(url.includes('slice-video') && url.includes('slice_order=')){
						console.log('Slice video failed, trying fallbacks...');
						
						// Fallback 1: Try with reduced timeout parameters
						if(url.includes('slice_count=3')){
							fallbackUrl = url.replace('slice_count=3', 'slice_count=2');
							console.log('Trying with reduced slice count:', fallbackUrl);
						}
						
						// Fallback 2: Try original video URL if available
						if(!fallbackUrl){
							const rel = relKeyFrom(item);
							if(rel){
								fallbackUrl = `${ORIGIN}/media/${rel}`;
								console.log('Falling back to original video:', fallbackUrl);
							}
						}
					}
					
					// Standard CDN->Origin fallback for regular videos
					if(!fallbackUrl && isVid){
						const rel = relKeyFrom(item);
						if(rel){
							fallbackUrl = `${ORIGIN}/media/${rel}`;
						}
					}
					
					if(fallbackUrl){
						console.log('Attempting fallback URL:', fallbackUrl);
						const node = await preloadVideo(fallbackUrl);
						node.className = 'media'; 
						node.loop = true; 
						node.autoplay = true; 
						node.muted = true; 
						node.playsInline = true;
						
						const eff = effectClassFor(item); 
						if(eff){ node.classList.add('anim'); node.classList.add(eff); }
						
						// Apply segment layout with fallback detection
						const host = back;
						node.__segmentHost = host;
						computeSegmentStyles(node, item, { host });
						attachSegmentNode(node, host);
						host.classList.add('fade'); 
						host.classList.remove('hidden');
						
						setTimeout(()=>{ try{ node.play().catch(()=>{});}catch{} }, 0);
						
						requestAnimationFrame(()=>{
							back.classList.add('visible'); back.classList.remove('fade');
							front.classList.add('fade'); front.classList.remove('visible');
							requestAnimationFrame(()=>{
								if(eff){ node.classList.remove('enter-slide-l','enter-slide-r','enter-zoom-in','enter-zoom-out'); node.style.opacity=''; }
							});
							// 🎬 ENHANCED: Match new 1.2s fade duration for smooth transitions
							setTimeout(()=>{ front.classList.add('hidden'); front.classList.remove('fade'); swapLayers(); }, 1300);
						});
						ensureVideoPlaying(node, 'fallback');
						
						try{ sendClientEvent('load_ok', item, null).catch(()=>{}); }catch{}
						console.log('Fallback successful');
						return;
					}
				}catch(fallbackError){
					console.error('Fallback also failed:', fallbackError);
				}
				
				overlay.textContent = `Load error: ${e&&e.message||'unknown'} (fallback failed)`;
				try{ sendClientEvent('load_fail', item, String(e&&e.message||e)).catch(()=>{}); }catch{}
			}
		}

		function nextIndex(){ if(!playlist.length) return 0; return (idx + 1) % playlist.length; }

		async function tick(){
			if(!playlist.length){ await fetchPlaylist(true); }
			if(!playlist.length){
				showIdleState('Waiting for schedule…');
				timer = setTimeout(tick, 3000);
				return;
			}
			hideIdleState();
			// On forced schedule switch, jump to first item to show transition immediately
			if(forceAdvanceNow){ forceAdvanceNow = false; idx = 0; }
			const item = playlist[idx];
			const dur = Math.max(1, parseInt(item.duration||10));
			const next = playlist[nextIndex()];
			const currentKey = keyFrom(item);
			const singleItemLoop = playlist.length === 1 && currentItemKey && currentItemKey === currentKey;

			if(singleItemLoop){
				const hosts = [front, back];
				let activeNode = null;
				for(const host of hosts){
					if(!host) continue;
					const candidate = host.querySelector('video, img');
					if(candidate){
						activeNode = candidate;
						break;
					}
				}
				if(activeNode){
					if(activeNode.tagName === 'VIDEO'){
						activeNode.loop = true;
						if(activeNode.paused || (activeNode.readyState||0) < 2){
							ensureVideoPlaying(activeNode, 'single-item-loop');
						}
					}
					if(Date.now() - lastFetchTs > PLAYLIST_REFRESH_MIN_MS){
						fetchPlaylist().catch(err => console.warn('Single-item refresh failed', err));
					}
					if(timer){ clearTimeout(timer); }
					const loopDelay = Math.max(PLAYLIST_REFRESH_MIN_MS, Math.min(dur * 1000, PLAYLIST_REFRESH_INTERVAL_MS));
					timer = setTimeout(tick, loopDelay);
					return;
				}
			}
			await primePreload(item);
			await alignToSyncWindow(item, dur);
			
			// 🚀 PROFESSIONAL PRELOADING: Enterprise-grade background preparation
			console.log('🎬 PROFESSIONAL PRELOADING: Preparing', PRELOAD_AHEAD, 'items for smooth transitions...');
			for(let i=1;i<=PRELOAD_AHEAD;i++){
				const it = playlist[(idx + i) % playlist.length];
				primePreload(it).catch(e => console.log('🚨 Professional preload optimizing for item', i, ':', e));
			}
			
			// 🎯 ENTERPRISE PRIORITY: Critical next item for zero-lag switching
			if(next && next !== item) {
				console.log('🚀 PRIORITY PROFESSIONAL preloading for instant switching...');
				primePreload(next).catch(e => console.log('🎬 Professional priority optimization:', e));
			}
			
			// 🏆 GLOBAL SYNC: All screens synchronized to server timestamp
			const syncMoment = syncCoordinator.calculateSyncMoment(dur);
			const currentTime = Date.now();
			const syncDelay = Math.max(0, syncMoment - currentTime);
			
			console.log('🎯 GLOBAL SYNC: All screens syncing in', syncDelay, 'ms to timestamp', syncMoment);
			
			// Wait for sync moment, then show item simultaneously across all screens
			if(syncDelay > 0) {
				if(timer){ clearTimeout(timer); }
				timer = setTimeout(async () => {
					await showItem(item);
					console.log('✅ SYNCHRONIZED: Screen', screenId, 'started at global sync timestamp');
					
					// Schedule next tick at synchronized interval
					if(timer){ clearTimeout(timer); }
					timer = setTimeout(tick, dur*1000);
				}, syncDelay);
				return;
			}
			
			// Immediate show if already at sync moment
			await showItem(item);
			idx = nextIndex();
			if(Date.now() - lastFetchTs > PLAYLIST_REFRESH_MIN_MS){ fetchPlaylist(); }
			
			// Use global sync for next transition instead of individual timing
			if(timer){ clearTimeout(timer); }
			timer = setTimeout(tick, dur*1000);
		}

		async function sendClientEvent(event, item, error){
			try{
				const body = { store_id: String(storeId), screen_id: String(screenId), event: String(event||'') };
				const fname = fileNameFrom(item); if(fname) body.file = fname;
				if(item && item.id) body.item_id = item.id;
				if(error) body.error = String(error).slice(0,200);
				const qs = new URLSearchParams(); if(pairCode) qs.set('user_code', pairCode);
				await fetch(`${ORIGIN}/api/client_event?`+qs.toString(), { method:'POST', headers: { 'Content-Type':'application/json', ...(pairCode?{'X-User-Code':pairCode}:{}) }, body: JSON.stringify(body) });
			}catch{}
		}

		window.addEventListener('resize', ()=>{ try{ applyOrientation(); }catch{} });
		(async function init(){
			if(!storeId || !screenId){ location.href = '/webplayer'; return; }
			
			// Initialize enhanced server time synchronization for perfect cross-screen sync
			console.log('🌐 Initializing enhanced server time synchronization for', screenId);
			await getServerTime();
			
			// Perform additional sync samples for better initial accuracy
			setTimeout(async () => {
				await getServerTime();
				console.log('🌐 Secondary server time sync completed for', screenId);
			}, 2000);
			
			// Set up frequent server time sync to maintain consistency
			setInterval(async () => {
				await getServerTime();
				console.log('🌐 Periodic server time sync refreshed for', screenId);
			}, 15000); // Sync every 15 seconds for better consistency
			
			// Additional high-frequency sync for the first 2 minutes
			let initialSyncCount = 0;
			const initialSyncInterval = setInterval(async () => {
				await getServerTime();
				initialSyncCount++;
				console.log(`🌐 Initial high-freq sync ${initialSyncCount} for`, screenId);
				
				if(initialSyncCount >= 8) { // 8 syncs in 2 minutes
					clearInterval(initialSyncInterval);
					console.log('🌐 Initial high-frequency sync phase completed for', screenId);
				}
			}, 15000); // Every 15 seconds for first 2 minutes
			
			// Prompt user-controlled fullscreen; avoid automatic requests that modern browsers block
			ensureFullscreenOnGesture();
			// Hint for users if fullscreen is blocked
			try{ 
				setTimeout(()=>{ 
					if(!isFullscreen()){ 
						overlay.textContent = `${overlay.textContent} • Press Enter or Click to go Fullscreen`; 
						console.log('Added fullscreen hint to overlay');
					} 
				}, 1000); 
			}catch{}
			// Kick off
			tick();
			if(!playlistRefreshTicker){
				playlistRefreshTicker = setInterval(()=>{
					fetchPlaylist(true).catch(err => console.warn('Periodic playlist refresh failed', err));
				}, PLAYLIST_REFRESH_INTERVAL_MS);
			}
			// Keep-alive heartbeat so dashboard sees this webplayer as online
			async function sendHeartbeat(){
				try{
					const qs = new URLSearchParams({ store_id: storeId, screen_id: screenId });
					if(pairCode) qs.set('user_code', pairCode);
					await fetch(`${ORIGIN}/api/screen_heartbeat?`+qs.toString(), { method:'GET', cache:'no-store', headers: pairCode?{'X-User-Code': pairCode}:{} });
				}catch{}
			}
			sendHeartbeat(); setInterval(sendHeartbeat, 30000);
			// Poll for server-side commands (like reload) to apply changes instantly
			setInterval(pollCommands, COMMANDS_POLL_MS);
			// Pause when tab hidden
			document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(timer){ clearTimeout(timer); timer=null; } } else { if(!timer) tick(); } });
		})();
	</script>
