<!DOCTYPE html>
<html>
<head>
    <title>VNC Remote Desktop</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #111; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: auto;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
        }
        #screen {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 16px;
            gap: 16px;
            background: #111;
        }
        #viewport {
            position: relative;
            width: 640px;
            height: 360px;
            border: 1px solid #333;
            background: #000;
            overflow: hidden;
        }
        #canvas {
            background: #000;
            width: 640px;  /* fixed small preview */
            height: 360px; /* 16:9 */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            position: absolute;
            inset: 0;
            z-index: 2;
        }
        #scheduledPreview {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            background: #0f172a;
        }
        #scheduledPreview img,
        #scheduledPreview video,
        #scheduledPreview .scheduled-preview-empty {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #scheduledPreview .scheduled-preview-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }
        #error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        #error h2 { color: #d32f2f; margin-bottom: 10px; }
        #error p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="status">Connecting…</div>
    <div id="screen">
        <div id="viewport">
            <div id="scheduledPreview"></div>
            <canvas id="canvas"></canvas>
        </div>
    </div>
    <div id="error">
        <h2>Connection Failed</h2>
        <p id="errorMsg"></p>
        <div style="margin-top:12px">
            <button id="restartBtn" style="display:none;padding:8px 12px;border:0;border-radius:8px;background:#1976d2;color:#fff;cursor:pointer">Restart Pi Client</button>
        </div>
    </div>

    <!-- Load Socket.IO from CDN with local fallback -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js" 
            integrity="sha384-/KNQL8Nu5gCHLqwqfQjA689Hhoqgi2S84SNUxC3roTe4EhJ9AfLkp8QiQcU8AMzI" 
            crossorigin="anonymous"
            onerror="this.onerror=null; this.src='/socket.io/socket.io.js'"></script>
    <script>
        function hasScheduledMedia() {
            return !!String(activeFile || '').trim();
        }

        function hideErrorOverlay() {
            const errorEl = document.getElementById('error');
            if (errorEl) {
                errorEl.style.display = 'none';
            }
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) {
                restartBtn.disabled = false;
                restartBtn.textContent = 'Restart Pi Client';
            }
        }

        // Define error handler first
        function showError(msg) {
            if (hasScheduledMedia()) {
                console.warn('Suppressing blocking error modal because scheduled media is available:', msg);
                hideErrorOverlay();
                return;
            }
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('error').style.display = 'block';
            const statusEl = document.getElementById('status');
            statusEl.textContent = '❌ Error';
            statusEl.style.background = 'rgba(211, 47, 47, 0.9)';
            // Offer restart if it's a Pi-side issue
            const restartBtn = document.getElementById('restartBtn');
            restartBtn.style.display = 'inline-block';
            restartBtn.onclick = () => {
                socket.emit('restart_client', { pi_id: piId });
                restartBtn.disabled = true;
                restartBtn.textContent = 'Restarting...';
                // After 8 seconds, close error and retry connection
                setTimeout(() => {
                    document.getElementById('error').style.display = 'none';
                    statusEl.textContent = 'Reconnecting...';
                    statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
                    socket.emit('vnc_connect', { pi_id: piId });
                }, 8000);
            };
        }
        
        // Wait for Socket.IO to load
        if (typeof io === 'undefined') {
            console.error('Socket.IO failed to load');
            showError('Failed to load Socket.IO library. Please refresh the page.');
        }
        
        // Get Pi ID from Flask template variable (passed from URL path)
        const piId = '{{ pi_id }}';
        const activeFile = {{ (active_file or '') | tojson }};
        const activeMediaType = {{ (active_media_type or '') | tojson }};
        const mediaBaseUrl = {{ (media_base_url or '/static/uploads/') | tojson }};
        
        if (!piId || piId === '') {
            showError('No Pi ID specified');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const scheduledPreviewEl = document.getElementById('scheduledPreview');
        const frameAnalysisCanvas = document.createElement('canvas');
        frameAnalysisCanvas.width = 32;
        frameAnalysisCanvas.height = 18;
        const frameAnalysisCtx = frameAnalysisCanvas.getContext('2d', { willReadFrequently: true });

        // Connect to server WebSocket
        // Force long-polling to avoid WebSocket upgrade issues behind proxies/CDNs
        const socket = io({
            transports: ['polling'],
            upgrade: false,
            withCredentials: true
        });

        socket.on('connect_error', (err) => {
            console.error('Socket connect_error:', err);
            statusEl.textContent = 'Retrying (polling)…';
            statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
        });

    let vncConnected = false;
    let initialSizeSet = false;
    let retryTimer = null;
    let stallTimer = null;
    let firstFrameTimer = null;
    let framesReceived = 0;
    let legacyStreamRequested = false;
    let hasVncFrames = false;
    let scheduledPreviewRendered = false;
    let liveDisplayReady = false;
    let consecutiveRenderableFrames = 0;

        function guessMediaType(file) {
            const text = String(file || '').trim().toLowerCase();
            if (!text) return '';
            const extension = text.includes('.') ? text.split('.').pop() : '';
            if (['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'm4v'].includes(extension)) {
                return 'video';
            }
            return 'image';
        }

        function buildMediaUrl(file) {
            const text = String(file || '').trim();
            if (!text) {
                return '';
            }
            if (/^https?:\/\//i.test(text) || text.startsWith('/')) {
                return text;
            }
            const base = String(mediaBaseUrl || '/static/uploads/');
            return `${base.replace(/\/$/, '')}/${text.replace(/^\//, '')}`;
        }

        function ensureScheduledPreviewPlayback() {
            const video = scheduledPreviewEl.querySelector('video');
            if (!video) {
                return;
            }

            video.muted = true;
            video.defaultMuted = true;
            video.autoplay = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = 'auto';

            const tryPlay = () => {
                const playPromise = video.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch((error) => {
                        console.warn('Scheduled preview video play() failed:', error);
                    });
                }
            };

            video.addEventListener('loadeddata', tryPlay, { once: true });
            video.addEventListener('canplay', tryPlay, { once: true });
            tryPlay();
        }

        function renderScheduledPreview() {
            if (scheduledPreviewRendered) {
                return;
            }
            if (!activeFile) {
                scheduledPreviewEl.innerHTML = '<div class="scheduled-preview-empty">Live Pi frames are unavailable.</div>';
                scheduledPreviewRendered = true;
                return;
            }
            const mediaType = String(activeMediaType || guessMediaType(activeFile)).toLowerCase();
            if (mediaType === 'video') {
                const previewSrc = /^https?:\/\//i.test(activeFile)
                    ? buildMediaUrl(activeFile)
                    : `/vpreview/640/${encodeURIComponent(activeFile)}?v=${Date.now()}`;
                const poster = /^https?:\/\//i.test(activeFile)
                    ? ''
                    : `/vthumb/640/${encodeURIComponent(activeFile)}?v=${Date.now()}`;
                scheduledPreviewEl.innerHTML = `<video muted autoplay loop playsinline preload="auto" ${poster ? `poster="${poster}"` : ''} src="${previewSrc}"></video>`;
                scheduledPreviewRendered = true;
                ensureScheduledPreviewPlayback();
                return;
            }
            const imageSrc = /^https?:\/\//i.test(activeFile)
                ? buildMediaUrl(activeFile)
                : `/thumb/640/${encodeURIComponent(activeFile)}?v=${Date.now()}`;
            scheduledPreviewEl.innerHTML = `<img src="${imageSrc}" alt="Scheduled media preview">`;
            scheduledPreviewRendered = true;
        }

        function showScheduledPreview(statusText) {
            renderScheduledPreview();
            hideErrorOverlay();
            scheduledPreviewEl.style.display = 'block';
            canvas.style.visibility = 'hidden';
            ensureScheduledPreviewPlayback();
            if (statusText) {
                statusEl.textContent = statusText;
                statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
            }
        }

        function hideScheduledPreview() {
            scheduledPreviewEl.style.display = 'none';
            canvas.style.visibility = 'visible';
        }

        function isMostlyBlackFrame(img) {
            if (!frameAnalysisCtx) {
                return false;
            }
            frameAnalysisCtx.clearRect(0, 0, frameAnalysisCanvas.width, frameAnalysisCanvas.height);
            frameAnalysisCtx.drawImage(img, 0, 0, frameAnalysisCanvas.width, frameAnalysisCanvas.height);
            const { data } = frameAnalysisCtx.getImageData(0, 0, frameAnalysisCanvas.width, frameAnalysisCanvas.height);
            let visiblePixels = 0;
            let darkPixels = 0;
            let luminanceTotal = 0;
            for (let index = 0; index < data.length; index += 4) {
                const alpha = data[index + 3];
                if (alpha < 16) {
                    continue;
                }
                visiblePixels += 1;
                const luminance = (data[index] * 0.2126) + (data[index + 1] * 0.7152) + (data[index + 2] * 0.0722);
                luminanceTotal += luminance;
                if (luminance < 12) {
                    darkPixels += 1;
                }
            }
            if (visiblePixels === 0) {
                return true;
            }
            return (darkPixels / visiblePixels) >= 0.985 || (luminanceTotal / visiblePixels) <= 6;
        }

        function isTargetPi(data) {
            return !!data && String(data.pi_id || '') === String(piId);
        }

        function requestLegacyFrames() {
            if (legacyStreamRequested || hasVncFrames) {
                return;
            }
            legacyStreamRequested = true;
            socket.emit('request_screenshot', { pi_id: piId });
            socket.emit('start_live_stream', { pi_id: piId });
        }

        function markDisplayReady() {
            if (!vncConnected) {
                vncConnected = true;
            }
            liveDisplayReady = true;
            hideErrorOverlay();
            hideScheduledPreview();
            statusEl.textContent = '✅ Connected';
            statusEl.style.background = 'rgba(76, 175, 80, 0.9)';
            if (retryTimer) clearTimeout(retryTimer);
            if (stallTimer) clearTimeout(stallTimer);
            if (firstFrameTimer) clearTimeout(firstFrameTimer);
        }

        function handleIncomingFrame(data, source = 'unknown') {
            if (!isTargetPi(data)) {
                return;
            }
            if (source !== 'vnc' && hasVncFrames) {
                return;
            }
            const frame = data.frame || data.screenshot;
            if (!frame) {
                return;
            }
            const img = new Image();
            img.onload = () => {
                if (isMostlyBlackFrame(img)) {
                    console.warn('Ignoring mostly black frame from', source);
                    consecutiveRenderableFrames = 0;
                    if (!liveDisplayReady) {
                        showScheduledPreview('Connected, showing schedule preview...');
                    }
                    requestLegacyFrames();
                    return;
                }
                framesReceived++;
                consecutiveRenderableFrames++;
                if (source === 'vnc' && !hasVncFrames) {
                    hasVncFrames = true;
                    if (legacyStreamRequested) {
                        socket.emit('stop_live_stream', { pi_id: piId });
                        legacyStreamRequested = false;
                    }
                }
                if (!initialSizeSet && data.width && data.height) {
                    canvas.width = data.width;
                    canvas.height = data.height;
                    initialSizeSet = true;
                }
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                if (liveDisplayReady || consecutiveRenderableFrames >= 2) {
                    markDisplayReady();
                }
            };
            img.src = 'data:image/jpeg;base64,' + frame;
        }

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            statusEl.textContent = 'Connecting to Pi...';
            statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
            showScheduledPreview('Connecting to Pi...');
            
            // Request VNC connection to Pi
            socket.emit('vnc_connect', { pi_id: piId });
            requestLegacyFrames();
            // Retry once after 4s if no response
            retryTimer = setTimeout(() => {
                if (!vncConnected && framesReceived === 0) {
                    console.log('⏳ No VNC response yet, retrying connect...');
                    statusEl.textContent = 'Retrying connect…';
                    socket.emit('vnc_connect', { pi_id: piId });
                }
            }, 4000);
            // After 10s, surface guidance ONLY if no frames received
            stallTimer = setTimeout(() => {
                if (!vncConnected && framesReceived === 0) {
                    statusEl.textContent = 'Trying fallback capture...';
                    statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
                    requestLegacyFrames();
                    setTimeout(() => {
                        if (!vncConnected && framesReceived === 0) {
                            showError('No response from Pi. If it persists, try Restart Pi Client.');
                        }
                    }, 6000);
                } else if (framesReceived > 0) {
                    console.log('✅ Frames detected, marking as connected');
                    markDisplayReady();
                }
            }, 10000);
        });

        socket.on('vnc_connected', (data) => {
            if (!isTargetPi(data)) {
                return;
            }
            console.log('🖥️ VNC connected to Pi:', data);
            showScheduledPreview('Connected, waiting for display...');
            if (retryTimer) clearTimeout(retryTimer);
            
            // Set backing resolution to incoming size but keep a fixed on-screen size
            if (data.width && data.height) {
                canvas.width = data.width;
                canvas.height = data.height;
            } else {
                // fallback backing size
                canvas.width = 1280;
                canvas.height = 720;
            }
            initialSizeSet = true;
            if (firstFrameTimer) clearTimeout(firstFrameTimer);
            firstFrameTimer = setTimeout(() => {
                if (framesReceived === 0) {
                    statusEl.textContent = 'Trying fallback capture...';
                    statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
                    requestLegacyFrames();
                    setTimeout(() => {
                        if (framesReceived === 0) {
                            showError('Connected to the Pi relay, but no display frames arrived. Falling back to screenshot/live-stream capture.');
                        }
                    }, 6000);
                }
            }, 6000);
        });

        // No window-fit scaling: keep a small fixed preview size per user request

        socket.on('vnc_data', (data) => {
            handleIncomingFrame(data, 'vnc');
        });

        socket.on('live_frame', (data) => {
            handleIncomingFrame(data, 'live');
        });

        socket.on('screenshot_data', (data) => {
            if (!isTargetPi(data)) {
                return;
            }
            if (data.error) {
                console.warn('Screenshot fallback error:', data.error);
                if (framesReceived === 0) {
                    showError(data.error);
                }
                return;
            }
            handleIncomingFrame(data, 'screenshot');
        });

        socket.on('vnc_error', (data) => {
            if (!isTargetPi(data)) {
                return;
            }
            console.error('❌ VNC error:', data);
            requestLegacyFrames();
            if (framesReceived === 0) {
                statusEl.textContent = 'Trying fallback capture...';
                statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
            }
        });

        socket.on('stream_error', (data) => {
            if (!isTargetPi(data)) {
                return;
            }
            console.error('❌ Stream error:', data);
            if (framesReceived === 0) {
                showError(data.error || 'Live stream failed');
            }
        });

        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            statusEl.textContent = '❌ Disconnected';
            statusEl.style.background = 'rgba(211, 47, 47, 0.9)';
            vncConnected = false;
            legacyStreamRequested = false;
            hasVncFrames = false;
            liveDisplayReady = false;
            consecutiveRenderableFrames = 0;
            showScheduledPreview();
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                ensureScheduledPreviewPlayback();
            }
        });

        window.addEventListener('beforeunload', () => {
            socket.emit('stop_live_stream', { pi_id: piId });
            socket.emit('vnc_disconnect', { pi_id: piId });
        });

        // Mouse and keyboard events
        canvas.addEventListener('mousemove', (e) => {
            if (!vncConnected) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
            const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
            
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_move',
                x: x,
                y: y
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!vncConnected) return;
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_down',
                button: e.button
            });
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!vncConnected) return;
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_up',
                button: e.button
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!vncConnected) return;
            e.preventDefault();
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'key_down',
                key: e.key,
                code: e.code
            });
        });

        document.addEventListener('keyup', (e) => {
            if (!vncConnected) return;
            e.preventDefault();
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'key_up',
                key: e.key,
                code: e.code
            });
        });
    </script>
</body>
</html>
