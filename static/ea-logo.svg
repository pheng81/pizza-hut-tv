<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320" role="img" aria-labelledby="title desc">
  <title id="title">Everyday Advertise</title>
  <desc id="desc">Brand wordmark for Everyday Advertise with a pink-to-blue gradient fill.</desc>
  <defs>
    <linearGradient id="eaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d84"/>
      <stop offset="50%" stop-color="#b544ff"/>
      <stop offset="100%" stop-color="#3c6cff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <g transform="translate(32, 220)" style="filter:url(#softShadow)">
    <text x="0" y="0" fill="url(#eaGrad)"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-weight="800" font-size="160" letter-spacing="1">
      <tspan>Everyday</tspan>
      <tspan x="0" dy="140">Advertise</tspan>
    </text>
  </g>
</svg>
