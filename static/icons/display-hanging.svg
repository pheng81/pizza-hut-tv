<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Display">
  <!-- Teal rounded background -->
  <rect x="8" y="8" width="112" height="112" rx="18" ry="18" fill="#1E7B7A"/>
  <!-- Hanging mount -->
  <path d="M64 22 l-18 14 h36 z" fill="#1E7B7A"/>
  <rect x="60" y="18" width="8" height="8" rx="2" fill="#F4F1EA"/>
  <path d="M64 26 L46 40 M64 26 L82 40" stroke="#F4F1EA" stroke-width="4" stroke-linecap="round"/>
  <!-- Display frame (white stroke) -->
  <rect x="22" y="40" width="84" height="56" rx="6" ry="6" fill="none" stroke="#F4F1EA" stroke-width="6"/>
  <!-- Inner safe area (no fill, for visual margin) -->
  <rect x="28" y="46" width="72" height="44" rx="4" ry="4" fill="none" stroke="#1E7B7A" stroke-width="2"/>
  <!-- Face inside the display -->
  <path d="M48 62 q4 -6 8 0" stroke="#F4F1EA" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M72 62 q4 -6 8 0" stroke="#F4F1EA" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M48 72 q16 12 32 0" stroke="#F4F1EA" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
