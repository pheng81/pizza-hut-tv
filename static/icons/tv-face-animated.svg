<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen -->
  <rect x="30" y="40" width="140" height="100" rx="12" ry="12" fill="#f5f5f5" stroke="#333" stroke-width="4"/>
  <!-- Hanging mount -->
  <line x1="100" y1="10" x2="100" y2="40" stroke="#333" stroke-width="4"/>
  <circle cx="100" cy="10" r="6" fill="#333"/>
  <!-- Eyes -->
  <circle id="eye-left" cx="70" cy="80" r="8" fill="#333"/>
  <circle id="eye-right" cx="130" cy="80" r="8" fill="#333"/>
  <!-- Smile -->
  <path d="M70 110 Q100 140 130 110" stroke="#333" stroke-width="5" fill="transparent"/>
  <style>
    /* Blink animation */
    @keyframes blink {
      0%, 90%, 100% { r: 8; }
      92%, 98% { r: 1; }
    }
    #eye-left, #eye-right {
      animation: blink 4s infinite;
    }
  </style>
</svg>
