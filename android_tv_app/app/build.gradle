plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace 'com.pizzahut.tv'
	compileSdk 34

	defaultConfig {
		applicationId 'com.pizzahut.tv'
		minSdk 21
	targetSdk 34
		versionCode 1
		versionName "1.0"

		// Provide configurable base URL accessible via BuildConfig.PHTV_BASE_URL
		buildConfigField 'String', 'PHTV_BASE_URL', '"http://192.168.1.109:5002/"'
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}
	buildFeatures {
		viewBinding true
		buildConfig true
	}
}

dependencies {
	implementation 'androidx.core:core-ktx:1.13.1'
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
	implementation 'com.squareup.retrofit2:retrofit:2.11.0'
	implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
	implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
	// ExoPlayer for faster, smoother video playback & pre-buffering
	implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
	implementation 'com.google.android.exoplayer:extension-okhttp:2.19.1'
}
