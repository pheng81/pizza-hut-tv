<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Pizza Hut TV (Offline Fallback)</title>
<style>
body { margin:0; background:#111; color:#eee; font-family: sans-serif; }
#log { position:fixed; top:0; left:0; background:rgba(0,0,0,0.6); padding:8px 12px; font-size:12px; max-width:60%; line-height:1.3; }
#content { display:flex; align-items:center; justify-content:center; height:100vh; font-size:3vw; text-align:center; }
.badge { display:inline-block; background:#C00; color:#fff; padding:2px 6px; margin-left:6px; border-radius:4px; font-size:0.6em; }
</style>
</head>
<body>
<div id="log">Offline fallback loaded.<br/>Store=<span id="store"></span> Screen=<span id="screen"></span></div>
<div id="content">Pizza Hut TV Offline <span class="badge">FALLBACK</span></div>
<script>
(function(){
  function qp(k){ return new URLSearchParams(location.search).get(k) || '' }
  document.getElementById('store').textContent = qp('store');
  document.getElementById('screen').textContent = qp('screen');
  if (window.NativeBridge && window.NativeBridge.log) {
    try { window.NativeBridge.log('Offline fallback HTML loaded'); } catch(e){}
  }
  // Send basic heartbeat every 5s so native layer sees activity
  setInterval(function(){
    if (window.NativeBridge && window.NativeBridge.heartbeat) {
      try { window.NativeBridge.heartbeat(Date.now()); } catch(e){}
    }
  }, 5000);
})();
</script>
</body>
</html>
