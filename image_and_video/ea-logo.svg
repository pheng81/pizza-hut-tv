<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 60" width="350" height="60" role="img" aria-label="EverydayAdvertise">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Background with rounded corners -->
  <rect x="4" y="10" width="40" height="40" rx="10" fill="url(#iconGrad)"/>
  
  <!-- Letter E in white -->
  <text x="24" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">E</text>
  
  <!-- Brand Text -->
  <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="22" font-weight="700" fill="#1a1a1a" dominant-baseline="middle">EverydayAdvertise</text>
</svg>
