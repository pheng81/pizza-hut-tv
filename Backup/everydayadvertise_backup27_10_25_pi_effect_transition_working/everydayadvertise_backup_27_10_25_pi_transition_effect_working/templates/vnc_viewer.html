<!DOCTYPE html>
<html>
<head>
    <title>VNC Remote Desktop</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #111; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: auto;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
        }
        #screen {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 16px;
            gap: 16px;
            background: #111;
        }
        #canvas {
            border: 1px solid #333;
            background: #000;
            width: 640px;  /* fixed small preview */
            height: 360px; /* 16:9 */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        #error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        #error h2 { color: #d32f2f; margin-bottom: 10px; }
        #error p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="status">Connecting…</div>
    <div id="screen">
        <canvas id="canvas"></canvas>
    </div>
    <div id="error">
        <h2>Connection Failed</h2>
        <p id="errorMsg"></p>
        <div style="margin-top:12px">
            <button id="restartBtn" style="display:none;padding:8px 12px;border:0;border-radius:8px;background:#1976d2;color:#fff;cursor:pointer">Restart Pi Client</button>
        </div>
    </div>

    <!-- Load Socket.IO from CDN with local fallback -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js" 
            integrity="sha384-/KNQL8Nu5gCHLqwqfQjA689Hhoqgi2S84SNUxC3roTe4EhJ9AfLkp8QiQcU8AMzI" 
            crossorigin="anonymous"
            onerror="this.onerror=null; this.src='/socket.io/socket.io.js'"></script>
    <script>
        // Define error handler first
        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('error').style.display = 'block';
            const statusEl = document.getElementById('status');
            statusEl.textContent = '❌ Error';
            statusEl.style.background = 'rgba(211, 47, 47, 0.9)';
            // Offer restart if it's a Pi-side issue
            const restartBtn = document.getElementById('restartBtn');
            restartBtn.style.display = 'inline-block';
            restartBtn.onclick = () => {
                socket.emit('restart_client', { pi_id: piId });
                restartBtn.disabled = true;
                restartBtn.textContent = 'Restarting...';
                // After 8 seconds, close error and retry connection
                setTimeout(() => {
                    document.getElementById('error').style.display = 'none';
                    statusEl.textContent = 'Reconnecting...';
                    statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
                    socket.emit('vnc_connect', { pi_id: piId });
                }, 8000);
            };
        }
        
        // Wait for Socket.IO to load
        if (typeof io === 'undefined') {
            console.error('Socket.IO failed to load');
            showError('Failed to load Socket.IO library. Please refresh the page.');
        }
        
        // Get Pi ID from Flask template variable (passed from URL path)
        const piId = '{{ pi_id }}';
        
        if (!piId || piId === '') {
            showError('No Pi ID specified');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        // Connect to server WebSocket
        // Force long-polling to avoid WebSocket upgrade issues behind proxies/CDNs
        const socket = io({
            transports: ['polling'],
            upgrade: false,
            withCredentials: true
        });

        socket.on('connect_error', (err) => {
            console.error('Socket connect_error:', err);
            statusEl.textContent = 'Retrying (polling)…';
            statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
        });

    let vncConnected = false;
    let initialSizeSet = false;
    let retryTimer = null;
    let stallTimer = null;

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            statusEl.textContent = 'Connecting to Pi...';
            statusEl.style.background = 'rgba(255, 152, 0, 0.9)';
            
            // Request VNC connection to Pi
            socket.emit('vnc_connect', { pi_id: piId });
            // Retry once after 4s if no response
            retryTimer = setTimeout(() => {
                if (!vncConnected) {
                    console.log('⏳ No VNC response yet, retrying connect...');
                    statusEl.textContent = 'Retrying connect…';
                    socket.emit('vnc_connect', { pi_id: piId });
                }
            }, 4000);
            // After 10s, surface guidance
            stallTimer = setTimeout(() => {
                if (!vncConnected) {
                    showError('No response from Pi. If it persists, try Restart Pi Client.');
                }
            }, 10000);
        });

        socket.on('vnc_connected', (data) => {
            console.log('🖥️ VNC connected to Pi:', data);
            vncConnected = true;
            statusEl.textContent = '✅ Connected';
            statusEl.style.background = 'rgba(76, 175, 80, 0.9)';
            if (retryTimer) clearTimeout(retryTimer);
            if (stallTimer) clearTimeout(stallTimer);
            
            // Set backing resolution to incoming size but keep a fixed on-screen size
            if (data.width && data.height) {
                canvas.width = data.width;
                canvas.height = data.height;
            } else {
                // fallback backing size
                canvas.width = 1280;
                canvas.height = 720;
            }
            initialSizeSet = true;
        });

        // No window-fit scaling: keep a small fixed preview size per user request

        socket.on('vnc_data', (data) => {
            // Receive VNC frame data from Pi (via server proxy)
            if (data.frame) {
                const img = new Image();
                img.onload = () => {
                    if (!initialSizeSet && data.width && data.height) {
                        canvas.width = data.width;
                        canvas.height = data.height;
                        initialSizeSet = true;
                    }
                    // Draw image scaled into the backing store; browser will shrink to fixed CSS size
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = 'data:image/jpeg;base64,' + data.frame;
            }
        });

        socket.on('vnc_error', (data) => {
            console.error('❌ VNC error:', data);
            showError(data.message || 'VNC connection failed');
        });

        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            statusEl.textContent = '❌ Disconnected';
            statusEl.style.background = 'rgba(211, 47, 47, 0.9)';
            vncConnected = false;
        });

        // Mouse and keyboard events
        canvas.addEventListener('mousemove', (e) => {
            if (!vncConnected) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
            const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
            
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_move',
                x: x,
                y: y
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!vncConnected) return;
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_down',
                button: e.button
            });
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!vncConnected) return;
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'mouse_up',
                button: e.button
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!vncConnected) return;
            e.preventDefault();
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'key_down',
                key: e.key,
                code: e.code
            });
        });

        document.addEventListener('keyup', (e) => {
            if (!vncConnected) return;
            e.preventDefault();
            socket.emit('vnc_data', {
                pi_id: piId,
                type: 'key_up',
                key: e.key,
                code: e.code
            });
        });
    </script>
</body>
</html>
