<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: white;
      padding: 20px;
    }
    .video-container {
      max-width: 800px;
      margin: 20px auto;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
    }
    h2 {
      color: #4CAF50;
      margin-bottom: 10px;
    }
    video {
      width: 100%;
      border-radius: 8px;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      background: #333;
    }
    .success { color: #4CAF50; }
    .error { color: #f44336; }
    .info { color: #2196F3; }
  </style>
</head>
<body>
  <h1>🎬 Video Playback Test</h1>
  
  <div class="video-container">
    <h2>1. Hero Video (promotion5.mp4)</h2>
    <video id="video1" autoplay loop muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='promotion5.mp4') }}" type="video/mp4">
    </video>
    <div class="status" id="status1">⏳ Loading...</div>
  </div>

  <div class="video-container">
    <h2>2. Demo Video (promotion.mp4)</h2>
    <video id="video2" controls autoplay loop muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='promotion.mp4') }}" type="video/mp4">
    </video>
    <div class="status" id="status2">⏳ Loading...</div>
  </div>

  <div class="video-container">
    <h2>3. Sync Demo Video (sync-demo.mp4)</h2>
    <video id="video3" controls autoplay loop muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='sync-demo.mp4') }}" type="video/mp4">
    </video>
    <div class="status" id="status3">⏳ Loading...</div>
  </div>

  <div class="video-container">
    <h2>4. Dashboard Video (dashboard.mp4)</h2>
    <video id="video4" controls autoplay loop muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='dashboard.mp4') }}" type="video/mp4">
    </video>
    <div class="status" id="status4">⏳ Loading...</div>
  </div>

  <script>
    const videos = [
      { id: 'video1', name: 'promotion5.mp4' },
      { id: 'video2', name: 'promotion.mp4' },
      { id: 'video3', name: 'sync-demo.mp4' },
      { id: 'video4', name: 'dashboard.mp4' }
    ];

    videos.forEach((videoInfo, index) => {
      const video = document.getElementById(videoInfo.id);
      const status = document.getElementById('status' + (index + 1));

      video.addEventListener('loadeddata', () => {
        status.innerHTML = `<span class="success">✅ Loaded successfully - ${video.duration.toFixed(1)}s duration</span>`;
      });

      video.addEventListener('playing', () => {
        status.innerHTML = `<span class="success">▶️ Playing - ${video.videoWidth}x${video.videoHeight}</span>`;
      });

      video.addEventListener('error', (e) => {
        const source = video.querySelector('source');
        status.innerHTML = `<span class="error">❌ Error loading ${videoInfo.name}<br>` +
          `Error code: ${video.error?.code}<br>` +
          `Message: ${video.error?.message || 'Unknown error'}<br>` +
          `Source: ${source?.src}</span>`;
      });

      video.addEventListener('stalled', () => {
        status.innerHTML = `<span class="info">⚠️ Video stalled (network issue)</span>`;
      });

      // Try to play
      video.muted = true;
      video.play().then(() => {
        console.log(`✅ ${videoInfo.name} playing`);
      }).catch((error) => {
        console.error(`❌ ${videoInfo.name} failed:`, error);
        status.innerHTML = `<span class="error">❌ Autoplay blocked: ${error.message}<br>Click video to play</span>`;
      });
    });
  </script>
</body>
</html>
