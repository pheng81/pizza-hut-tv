<!DOCTYPE html>
<html>
<head>
  <title>Test Logo Animation</title>
  <style>
    * { margin: 0; padding: 0; }
    
    .logo-intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    
    .logo-intro.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .logo-text {
      font-size: 72px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      animation: logoSlideIn 1s ease-out;
    }
    
    .logo-line1 {
      color: #ff9500;
      display: block;
    }
    
    .logo-line2 {
      color: #ff2d55;
      display: block;
    }
    
    @keyframes logoSlideIn {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(30px);
      }
      50% {
        transform: scale(1.08);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="logo-intro" id="logoIntro">
    <div class="logo-text">
      <span class="logo-line1">Everyday</span>
      <span class="logo-line2">Advertise</span>
    </div>
  </div>
  
  <div style="background: white; padding: 100px; text-align: center;">
    <h1>Main Content Below Logo</h1>
    <p>If you saw the black screen with orange/pink text first, the animation works!</p>
  </div>

  <script>
    console.log('Logo intro test initialized');
    
    setTimeout(function() {
      console.log('Starting logo fade out');
      var logoIntro = document.getElementById('logoIntro');
      if (logoIntro) {
        logoIntro.classList.add('hidden');
        setTimeout(function() {
          console.log('Logo intro removed');
          logoIntro.remove();
        }, 600);
      }
    }, 2500);
  </script>
</body>
</html>
