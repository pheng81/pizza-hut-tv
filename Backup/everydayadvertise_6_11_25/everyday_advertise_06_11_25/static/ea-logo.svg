<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-label="EverydayAdvertise">
  <defs>
    <linearGradient id="eaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d84"/>
      <stop offset="50%" stop-color="#b544ff"/>
      <stop offset="100%" stop-color="#3c6cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dy="1" result="o"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect fill="none" width="100%" height="100%"/>
  <!-- Wordmark rendered as text; uses system UI fonts so it loads instantly. -->
  <g filter="url(#shadow)">
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="800" fill="url(#eaGrad)">EverydayAdvertise</text>
  </g>
</svg>
